<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conference Registration</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo h1 {
      margin: 0;
      color: #173b63;
      font-size: 28px;
    }

    .logo p {
      color: #777;
      margin-top: 8px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dbe3;
      border-radius: 9px;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #173b63;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #173b63;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0f2b49;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .success {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      background: #eef8f1;
      text-align: center;
    }

    .success h2 {
      color: #26734d;
    }

    .participant-id {
      font-size: 24px;
      font-weight: bold;
      color: #173b63;
      margin: 15px 0;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #fff0f0;
      color: #b42318;
      font-size: 14px;
    }

    .note {
      font-size: 13px;
      color: #777;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">
      <h1>The 2nd Menoufia Dental Congress</h1>
      <p>Participant Registration</p>
    </div>

    <form id="registrationForm">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="institution">University / Institution</label>
      <input
        type="text"
        id="institution"
        placeholder="Enter your university or institution"
        required
      >

      <label for="category">Participant Type</label>

      <select id="category" required>
        <option value="">Select participant type</option>
        <option>Student</option>
        <option>Dentist</option>
        <option>Faculty Member</option>
        <option>Speaker</option>
        <option>Judge</option>
        <option>Organizer</option>
        <option>Other</option>
      </select>

      <button type="submit" id="registerButton">
        Register
      </button>

      <div class="error" id="errorMessage"></div>

    </form>

    <div class="success" id="successMessage">

      <h2>Registration Successful 🎉</h2>

      <p>Thank you for registering.</p>

      <p>Your Participant ID is:</p>

      <div class="participant-id" id="participantId"></div>

      <p>
        Please keep this ID for the next steps.
      </p>

    </div>

    <div class="note">
      The 2nd Menoufia Dental Congress
    </div>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    getFirestore,
    doc,
    setDoc
  }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


  // Firebase configuration

  const firebaseConfig = {

    apiKey: "AIzaSyAB-AIOIQH0tOcVXQnUt7pvVnQi0CoFwSo",

    authDomain:
      "menoufia-dental-congress.firebaseapp.com",

    projectId:
      "menoufia-dental-congress",

    storageBucket:
      "menoufia-dental-congress.firebasestorage.app",

    messagingSenderId:
      "20481129823",

    appId:
      "1:20481129823:web:24658314d19bcacf1dcaea"

  };


  // Initialize Firebase

  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  // Registration form

  const form =
    document.getElementById("registrationForm");

  const button =
    document.getElementById("registerButton");

  const errorMessage =
    document.getElementById("errorMessage");


  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    button.disabled = true;
    button.textContent = "Registering...";

    errorMessage.style.display = "none";


    try {

      // Create unique Participant ID

      const participantId =
        "MDC-" +
        Date.now().toString().slice(-8);


      // Collect participant data

      const participantData = {

        participantId: participantId,

        fullName:
          document.getElementById("name").value.trim(),

        email:
          document.getElementById("email").value.trim(),

        institution:
          document.getElementById("institution").value.trim(),

        category:
          document.getElementById("category").value,

        attendance: false,

        createdAt:
          new Date().toISOString()

      };


      // Save to Firestore

      await setDoc(
        doc(db, "participants", participantId),
        participantData
      );


      // Show success message

      document.getElementById("participantId")
        .textContent = participantId;

      form.style.display = "none";

      document.getElementById("successMessage")
        .style.display = "block";


    } catch (error) {

      console.error(error);

      errorMessage.textContent =
        "Registration failed. Please try again.";

      errorMessage.style.display = "block";

      button.disabled = false;

      button.textContent = "Register";

    }

  });

</script>

</body>
</html>
