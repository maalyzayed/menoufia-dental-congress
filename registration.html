<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conference Registration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo h1 {
      margin: 0;
      color: #173b63;
      font-size: 28px;
    }

    .logo p {
      color: #777;
      margin-top: 8px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dbe3;
      border-radius: 9px;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #173b63;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #173b63;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0f2b49;
    }

    .success {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      background: #eef8f1;
      text-align: center;
    }

    .success h2 {
      color: #26734d;
    }

    .participant-id {
      font-size: 24px;
      font-weight: bold;
      color: #173b63;
      margin: 15px 0;
    }

    .note {
      font-size: 13px;
      color: #777;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">
        <h1>The 2nd Menoufia Dental Congress</h1>
        <p>Participant Registration</p>
      </div>

      <form id="registrationForm">

        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        >

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label for="institution">University / Institution</label>
        <input
          type="text"
          id="institution"
          placeholder="Enter your university or institution"
          required
        >

        <label for="category">Participant Type</label>

        <select id="category" required>
          <option value="">Select participant type</option>
          <option>Student</option>
          <option>Dentist</option>
          <option>Faculty Member</option>
          <option>Speaker</option>
          <option>Judge</option>
          <option>Organizer</option>
          <option>Other</option>
        </select>

        <button type="submit">
          Register
        </button>

      </form>

      <div class="success" id="successMessage">

        <h2>Registration Successful 🎉</h2>

        <p>Thank you for registering.</p>

        <p>Your Participant ID is:</p>

        <div class="participant-id" id="participantId">
          MDC-0001
        </div>

        <p>
          Please keep this ID for the next steps.
        </p>

      </div>

      <div class="note">
        The 2nd Menoufia Dental Congress
      </div>

    </div>

  </div>

  <script>

    const form = document.getElementById("registrationForm");

    form.addEventListener("submit", function(event) {

      event.preventDefault();

      // Temporary Participant ID
      const randomNumber = Math.floor(1000 + Math.random() * 9000);

      const participantID = "MDC-" + randomNumber;

      document.getElementById("participantId").textContent = participantID;

      form.style.display = "none";

      document.getElementById("successMessage").style.display = "block";

    });

  </script>

</body>
</html>
