<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- منع استخدام النسخة القديمة -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>معاينة الشهادة | مؤتمر المنوفية لطب الأسنان</title>

  <!-- خط الاسم -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <!-- HTML2Canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- FileSaver -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <!-- QR Code -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    /* ================================
       الصفحة
       ================================ */

    body {
      margin: 0;
      min-height: 100vh;

      font-family: Arial, sans-serif;

      background: #f4f7fb;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding: 20px;
    }


    /* ================================
       الحاوية
       ================================ */

    .container {

      width: 100%;

      max-width: 900px;

      text-align: center;

    }


    /* ================================
       الشهادة
       ================================ */

    .certificate-wrapper {

      position: relative;

      width: 100%;

      background: white;

      border-radius: 12px;

      box-shadow: 0 8px 30px rgba(0,0,0,0.1);

      overflow: hidden;

      margin-bottom: 20px;

      display: none;

      /*
        مهم جدًا:
        يجعل حجم الخط يعتمد على عرض الشهادة
      */

      container-type: inline-size;

    }


    /* ================================
       تصميم الشهادة الأساسي
       ================================ */

    #renderCert {

      position: relative !important;

      width: 100%;

      /*
        مقاس الصورة الثانية:
        1448 × 1086
      */

      aspect-ratio: 1448 / 1086;

      background-image: url('certificate-template.jpg?v=5');

      background-size: 100% 100%;

      background-position: center;

      background-repeat: no-repeat;

    }


    /* ================================
       الاسم
       ================================ */

    .cert-name-container {

      position: absolute !important;

      /*
        مكان الاسم مطابق تقريبًا
        لمكانه في الصورة الثانية
      */

      left: 23.5%;

      top: 41.5%;

      width: 52%;

      height: 10%;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      z-index: 5;

    }


    .cert-name {

      color: #102c52;

      font-family:
        'Great Vibes',
        cursive,
        Arial,
        sans-serif;

      /*
        حجم الاسم يتناسب
        مع حجم الشهادة
      */

      font-size: 3.9cqw;

      font-weight: bold;

      white-space: nowrap;

      line-height: 1;

      max-width: 100%;

    }


    /* ================================
       QR Code
       ================================ */

    .cert-qr-container {

      position: absolute !important;

      /*
        مكان QR في أسفل يسار الشهادة
      */

      left: 4.2%;

      top: 65.2%;

      /*
        حجم QR
      */

      width: 8%;

      height: 10.5%;

      background: white;

      display: flex;

      align-items: center;

      justify-content: center;

      z-index: 10;

      overflow: hidden;

    }


    .cert-qr-container img,
    .cert-qr-container canvas {

      width: 100% !important;

      height: 100% !important;

      display: block;

    }


    /* ================================
       رقم الشهادة
       ================================ */

    .cert-id-container {

      position: absolute !important;

      /*
        رقم الشهادة أسفل QR
      */

      left: 4.6%;

      top: 91%;

      width: 10%;

      height: 3.5%;

      background: #173b63;

      display: flex;

      align-items: center;

      justify-content: center;

      z-index: 10;

      overflow: hidden;

    }


    .cert-id-text {

      color: white;

      /*
        حجم رقم الشهادة
        يتناسب مع الشهادة
      */

      font-size: 0.85cqw;

      font-weight: bold;

      font-family: Arial, sans-serif;

      white-space: nowrap;

      line-height: 1;

    }


    /* ================================
       زر التحميل
       ================================ */

    .download-btn {

      background: #c9a227;

      color: white;

      border: none;

      padding: 14px 28px;

      font-size: 16px;

      font-weight: bold;

      border-radius: 10px;

      cursor: pointer;

      box-shadow:
        0 4px 15px rgba(201, 162, 39, 0.3);

      display: none;

      margin-top: 15px;

    }


    .download-btn:hover {

      background: #b08d1f;

    }


    .download-btn:disabled {

      opacity: 0.7;

      cursor: wait;

    }


    /* ================================
       رسالة الحالة
       ================================ */

    .status-box {

      font-size: 18px;

      color: #d9534f;

      background: #fdf7f7;

      border: 1px solid #ebccd1;

      padding: 15px;

      border-radius: 8px;

      margin-bottom: 20px;

      font-weight: bold;

    }


    /* ================================
       الموبايل
       ================================ */

    @media (max-width: 600px) {

      body {

        padding: 10px;

      }


      .container {

        width: 100%;

      }


      .certificate-wrapper {

        border-radius: 6px;

        box-shadow:
          0 4px 15px rgba(0,0,0,0.1);

      }


      .download-btn {

        width: 100%;

        font-size: 15px;

        padding: 13px 15px;

      }


      .status-box {

        font-size: 15px;

      }

    }


  </style>

</head>


<body>


<div class="container">


  <!-- رسالة الحالة -->

  <div id="statusBox" class="status-box">

    جاري الاتصال بقاعدة البيانات وتحميل الشهادة...

  </div>


  <!-- ================================
       الشهادة
       ================================ -->

  <div
    class="certificate-wrapper"
    id="certWrapper"
  >


    <div id="renderCert">


      <!-- ================================
           الاسم
           ================================ -->

      <div class="cert-name-container">

        <div
          id="renderName"
          class="cert-name"
        ></div>

      </div>


      <!-- ================================
           QR Code
           ================================ -->

      <div
        class="cert-qr-container"
        id="renderQr"
      ></div>


      <!-- ================================
           رقم الشهادة
           ================================ -->

      <div class="cert-id-container">

        <div
          id="renderId"
          class="cert-id-text"
        ></div>

      </div>


    </div>


  </div>


  <!-- ================================
       زر التحميل
       ================================ -->

  <button
    id="downloadBtn"
    class="download-btn"
  >

    📥 تنزيل الشهادة كصورة (PNG)

  </button>


</div>



<!-- ================================
     JavaScript
     ================================ -->

<script type="module">


  /* =====================================
     Firebase
     ===================================== */

  import {

    initializeApp

  } from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


  import {

    getFirestore,

    doc,

    getDoc

  } from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



  /* =====================================
     Firebase Configuration
     ===================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyAB-AIOIQH0tOcVXQnUt7pvVnQi0CoFwSo",

    authDomain:
      "menoufia-dental-congress.firebaseapp.com",

    projectId:
      "menoufia-dental-congress",

    storageBucket:
      "menoufia-dental-congress.firebasestorage.app",

    messagingSenderId:
      "20481129823",

    appId:
      "1:20481129823:web:24658314d19bcacf1dcaea"

  };



  /* =====================================
     عناصر الصفحة
     ===================================== */

  const statusBox =
    document.getElementById("statusBox");


  const certWrapper =
    document.getElementById("certWrapper");


  const downloadBtn =
    document.getElementById("downloadBtn");



  /* =====================================
     تحميل الشهادة
     ===================================== */

  try {


    /* إنشاء Firebase */

    const app =
      initializeApp(firebaseConfig);


    const db =
      getFirestore(app);



    /* =====================================
       قراءة رقم الشهادة من الرابط
       ===================================== */

    const urlParams =
      new URLSearchParams(
        window.location.search
      );


    const certId =
      urlParams.get("id");



    /* التأكد من وجود الرقم */

    if (!certId) {

      statusBox.textContent =
        "خطأ: لم يتم كتابة رقم الشهادة في الرابط (مثلاً: ?id=رقم_الشهادة)";

      throw new Error(
        "No ID provided"
      );

    }



    /* رسالة البحث */

    statusBox.textContent =
      `جاري البحث عن الشهادة برقم: ${certId} ...`;



    /* =====================================
       الحصول على بيانات الشهادة
       ===================================== */

    const docRef =
      doc(
        db,
        "certificates",
        certId
      );


    const docSnap =
      await getDoc(docRef);



    /* التأكد من وجود الشهادة */

    if (!docSnap.exists()) {

      statusBox.textContent =
        `خطأ: رقم الشهادة (${certId}) غير موجود داخل قاعدة بيانات Firebase.`;

      throw new Error(
        "Document not found"
      );

    }



    /* بيانات الشهادة */

    const data =
      docSnap.data();



    /* =====================================
       اسم المشارك
       ===================================== */

    const rawName =

      data.fullName ||

      data.name ||

      data.ParticipantName ||

      "مشارك بدون اسم";



    /*
      إضافة DR/
      إذا لم يكن موجودًا
    */

    const fullName =

      rawName.startsWith("DR/") ||

      rawName.startsWith("Dr/")

        ? rawName

        : `DR/ ${rawName}`;



    /* عرض الاسم */

    document.getElementById(
      "renderName"
    ).textContent = fullName;



    /* =====================================
       عرض رقم الشهادة
       ===================================== */

    document.getElementById(
      "renderId"
    ).textContent = certId;



    /* =====================================
       QR Code
       ===================================== */

    const qrDiv =
      document.getElementById(
        "renderQr"
      );


    /* تنظيف QR القديم */

    qrDiv.innerHTML = "";



    /*
      إنشاء QR جديد

      الحجم 300 × 300
      ثم CSS يقوم بتصغيره
      حسب مساحة QR في الشهادة
    */

    new QRCode(
      qrDiv,
      {

        text:
          window.location.href,

        width:
          300,

        height:
          300,

        correctLevel:
          QRCode.CorrectLevel.H

      }
    );



    /* =====================================
       إظهار الشهادة
       ===================================== */

    statusBox.style.display =
      "none";


    certWrapper.style.display =
      "block";


    downloadBtn.style.display =
      "inline-block";


  }


  /* =====================================
     معالجة الأخطاء
     ===================================== */

  catch (err) {


    console.error(
      "تفاصيل الخطأ:",
      err
    );


    if (
      !statusBox.textContent.includes(
        "خطأ:"
      )
    ) {

      statusBox.textContent =
        "حدث خطأ برمجي أثناء الاتصال: " +
        err.message;

    }

  }



  /* =====================================
     تحميل الشهادة كصورة PNG
     ===================================== */

  downloadBtn.addEventListener(

    "click",

    async () => {


      /* تعطيل الزر */

      downloadBtn.disabled =
        true;


      downloadBtn.textContent =
        "جاري حفظ الصورة...";


      try {


        /* =================================
           تحويل الشهادة إلى Canvas
           ================================= */

        const canvas =
          await html2canvas(

            document.getElementById(
              "renderCert"
            ),

            {

              /*
                جودة عالية
              */

              scale: 2,

              useCORS: true

            }

          );



        /* =================================
           حفظ الصورة
           ================================= */

        canvas.toBlob(

          blob => {


            saveAs(

              blob,

              `Certificate-${
                new URLSearchParams(
                  window.location.search
                ).get("id")
                || "Certificate"
              }.png`

            );


            /* إعادة تفعيل الزر */

            downloadBtn.disabled =
              false;


            downloadBtn.textContent =
              "📥 تنزيل الشهادة كصورة (PNG)";


          }

        );


      }


      catch (err) {


        alert(

          "خطأ في التنزيل: " +
          err.message

        );


        downloadBtn.disabled =
          false;


        downloadBtn.textContent =
          "📥 تنزيل الشهادة كصورة (PNG)";

      }


    }

  );


</script>


</body>

</html>
