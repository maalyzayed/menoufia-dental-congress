<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Menoufia Dental Congress - Certificate</title>

  <!-- QR Code Library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <!-- مكتبة التحويل إلى صورة html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  /* حاوية الشهادة */
  #renderCert {
    position: relative; 
    width: 1536px; 
    height: 1024px; 
    background-image: url('certificate-template.jpg?v=3'); 
    background-size: 100% 100%; 
    background-position: center; 
    background-repeat: no-repeat; 
    padding: 55px;
  }

  /* مكان الاسم (تم تعديل الـ top عشان ينزل جوه الإطار تماماً) */
  .cert-name-container {
    position: absolute; 
    left: 20%; 
    top: 41.5%; /* نزلتها من 39.5% لـ 41.5% */
    width: 60%; 
    height: 12%; 
    display: flex; 
    align-items: center; 
    justify-content: center;
  }
  .cert-name {
    color: #102c52; 
    font-family: 'Brush Script MT', 'Segoe Script', cursive; 
    font-size: 52px; 
    white-space: nowrap;
  }

  /* مكان الـ QR Code (تم تعديل الـ top عشان ينزل تحت الدائرة الذهبية) */
  .cert-qr-container {
    position: absolute; 
    left: 5.5%; 
    top: 69%; /* نزلتها من 66% لـ 69% */
    width: 9.5%; 
    height: 15%; 
    background: white; 
    display: flex; 
    align-items: center; 
    justify-content: center;
  }

  /* مكان رقم الشهادة تحت الـ QR */
  .cert-id-container {
    position: absolute; 
    left: 5.5%; 
    top: 84.5%; /* نزلتها بالتناسب مع الـ QR */
    width: 9.5%; 
    height: 4%; 
    background: #173b63; 
    display: flex; 
    align-items: center; 
    justify-content: center;
  }
  .cert-id-text {
    color: white; 
    font-family: Arial, sans-serif; 
    font-size: 11px; 
    font-weight: bold;
  }
</style>
</head>

<body>

  <div id="loading" class="loading">
    Loading certificate...
  </div>

  <div id="error" class="error" style="display:none;"></div>

  <div class="certificate-wrapper">
    <div id="certificate" class="certificate">
      <div class="participant-name-area">
        <div id="participantName" class="participant-name">Participant Name</div>
      </div>
      <div class="qr-area">
        <div id="qrcode"></div>
      </div>
      <div class="certificate-id-area">
        <div id="certificateId" class="certificate-id">MDC-2026-0001</div>
      </div>
    </div>

    <button id="downloadBtn" class="download-btn">📥 تنزيل الشهادة كصورة (PNG)</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAB-AIOIQH0tOcVXQnUt7pvVnQi0CoFwSo",
      authDomain: "menoufia-dental-congress.firebaseapp.com",
      projectId: "menoufia-dental-congress",
      storageBucket: "menoufia-dental-congress.firebasestorage.app",
      messagingSenderId: "20481129823",
      appId: "1:20481129823:web:24658314d19bcacf1dcaea"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function showError(message) {
      document.getElementById("loading").style.display = "none";
      const error = document.getElementById("error");
      error.textContent = message;
      error.style.display = "block";
    }

    async function loadCertificate() {
      const params = new URLSearchParams(window.location.search);
      const certificateId = params.get("id");

      if (!certificateId) {
        showError("No certificate ID was provided.");
        return;
      }

      try {
        const certificateRef = doc(db, "certificates", certificateId);
        const certificateSnap = await getDoc(certificateRef);

        if (!certificateSnap.exists()) {
          showError("Certificate not found.");
          return;
        }

        const data = certificateSnap.data();
        let rawName = data.fullName || "Participant";
        
        let cleanName = rawName.trim();
        if (!/^dr[\/.\s]/i.test(cleanName)) {
          cleanName = "DR/ " + cleanName;
        } else {
          cleanName = cleanName.replace(/^dr[\/.\s]+/i, "DR/ ");
        }

        document.getElementById("participantName").textContent = cleanName;
        document.getElementById("certificateId").textContent = certificateId;

        const verificationUrl = window.location.origin + window.location.pathname + "?id=" + encodeURIComponent(certificateId);
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = "";

        new QRCode(qrContainer, {
          text: verificationUrl,
          width: 150,
          height: 150,
          correctLevel: QRCode.CorrectLevel.H
        });

        document.getElementById("loading").style.display = "none";
        document.getElementById("certificate").style.display = "block";
        document.getElementById("downloadBtn").style.display = "block";

      } catch (error) {
        console.error("Certificate error:", error);
        showError("Error: " + error.code + " — " + error.message);
      }
    }

    // تفعيل زر التنزيل كصورة عالية الجودة
    document.getElementById("downloadBtn").addEventListener("click", () => {
      const certElement = document.getElementById("certificate");
      const certId = document.getElementById("certificateId").textContent;
      
      document.getElementById("downloadBtn").textContent = "جاري التحميل...";
      
      html2canvas(certElement, { scale: 2, useCORS: true }).then(canvas => {
        const link = document.createElement("a");
        link.download = `Certificate-${certId}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
        document.getElementById("downloadBtn").textContent = "📥 تنزيل الشهادة كصورة (PNG)";
      }).catch(err => {
        console.error(err);
        alert("حدث خطأ أثناء تنزيل الشهادة.");
        document.getElementById("downloadBtn").textContent = "📥 تنزيل الشهادة كصورة (PNG)";
      });
    });

    loadCertificate();
  </script>

</body>
</html>
