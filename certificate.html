<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>معاينة الشهادة | مؤتمر المنوفية لطب الأسنان</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    .status-box {
      color: #173b63;
      background: #fff;
      border: 1px solid #d8e1ec;
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-weight: bold;
    }

    .certificate-wrapper {
      width: 100%;
      display: none;
      background: #fff;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      overflow: hidden;
      container-type: inline-size;
    }

    /* التصميم الأصلي 1536 × 1024 = 3:2 */
    #renderCert {
      position: relative;
      width: 100%;
      aspect-ratio: 1536 / 1024;
      background-image: url('certificate-template-HQ.png?v=1');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    .cert-name-container {
      position: absolute;
      left: 22.4%;
      top: 39.4%;
      width: 52.7%;
      height: 10.0%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 5;
    }

    .cert-name {
      color: #102c52;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 3.45cqw;
      font-style: italic;
      font-weight: 700;
      line-height: .95;
      white-space: nowrap;
      max-width: 100%;
      text-align: center;
    }

    .cert-qr-container {
      position: absolute;
      left: 3.45%;
      top: 75.15%;
      width: 8.45%;
      height: 13.0%;
      background: #fff;
      padding: .25%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      overflow: hidden;
    }

    .cert-qr-container img,
    .cert-qr-container canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      image-rendering: pixelated;
    }

    .cert-id-container {
      position: absolute;
      left: 3.45%;
      top: 88.25%;
      width: 8.45%;
      height: 3.25%;
      background: #173b63;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      overflow: hidden;
    }

    .cert-id-text {
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: .82cqw;
      font-weight: bold;
      line-height: 1;
      white-space: nowrap;
    }

    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #downloadBtn { background: #c9a227; color: #fff; }
    #downloadPngBtn { background: #173b63; color: #fff; }
    button:disabled { opacity: .65; cursor: wait; }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .buttons button { width: 100%; }
      .cert-name { font-size: 3.5cqw; }
    }
  </style>
</head>

<body>
<div class="container">
  <div id="statusBox" class="status-box">جاري الاتصال بقاعدة البيانات وتحميل الشهادة...</div>

  <div id="certWrapper" class="certificate-wrapper">
    <div id="renderCert">
      <div class="cert-name-container">
        <div id="renderName" class="cert-name"></div>
      </div>

      <div id="renderQr" class="cert-qr-container"></div>

      <div class="cert-id-container">
        <div id="renderId" class="cert-id-text"></div>
      </div>
    </div>
  </div>

  <div class="buttons">
    <button id="downloadBtn">📄 تنزيل الشهادة PDF بجودة عالية جدًا</button>
    <button id="downloadPngBtn">🖼️ تنزيل PNG بجودة أصلية</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAB-AIOIQH0tOcVXQnUt7pvVnQi0CoFwSo",
    authDomain: "menoufia-dental-congress.firebaseapp.com",
    projectId: "menoufia-dental-congress",
    storageBucket: "menoufia-dental-congress.firebasestorage.app",
    messagingSenderId: "20481129823",
    appId: "1:20481129823:web:24658314d19bcacf1dcaea"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const statusBox = document.getElementById("statusBox");
  const certWrapper = document.getElementById("certWrapper");
  const renderCert = document.getElementById("renderCert");
  const downloadBtn = document.getElementById("downloadBtn");
  const downloadPngBtn = document.getElementById("downloadPngBtn");

  const params = new URLSearchParams(window.location.search);
  const certId = params.get("id");

  // 4× = 6144×4096 canvas لأن التصميم الأساسي 1536×1024.
  const EXPORT_SCALE = 4;
  const DESIGN_WIDTH = 1536;
  const DESIGN_HEIGHT = 1024;

  function formatDoctorName(rawName) {
    const clean = String(rawName || "Participant").trim();
    if (/^dr[\/\.\s]/i.test(clean)) {
      return clean.replace(/^dr[\/\.\s]+/i, "DR/ ");
    }
    return "DR/ " + clean;
  }

  async function waitForCertificateAssets() {
    if (document.fonts?.ready) await document.fonts.ready;
    const bg = new Image();
    bg.src = "certificate-template-HQ.png?v=1";
    await new Promise((resolve, reject) => {
      bg.onload = resolve;
      bg.onerror = reject;
    });
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  }

  function makeQRCode(certId) {
    const qrDiv = document.getElementById("renderQr");
    qrDiv.innerHTML = "";

    const verificationUrl =
      window.location.origin +
      "/menoufia-dental-congress/certificate.html?id=" +
      encodeURIComponent(certId);

    new QRCode(qrDiv, {
      text: verificationUrl,
      width: 600,
      height: 600,
      correctLevel: QRCode.CorrectLevel.H
    });
  }

  async function renderHighResolutionCanvas() {
    await waitForCertificateAssets();

    return await html2canvas(renderCert, {
      scale: EXPORT_SCALE,
      width: DESIGN_WIDTH,
      height: DESIGN_HEIGHT,
      windowWidth: DESIGN_WIDTH,
      windowHeight: DESIGN_HEIGHT,
      useCORS: true,
      allowTaint: false,
      backgroundColor: "#ffffff",
      imageTimeout: 30000,
      logging: false,
      removeContainer: true,
      foreignObjectRendering: false
    });
  }

  try {
    if (!certId) throw new Error("لم يتم وضع رقم الشهادة في الرابط.");

    statusBox.textContent = `جاري البحث عن الشهادة برقم: ${certId} ...`;

    const snap = await getDoc(doc(db, "certificates", certId));
    if (!snap.exists()) {
      throw new Error(`رقم الشهادة (${certId}) غير موجود داخل قاعدة البيانات.`);
    }

    const data = snap.data();
    const fullName = formatDoctorName(
      data.fullName || data.name || data.ParticipantName || "مشارك بدون اسم"
    );

    document.getElementById("renderName").textContent = fullName;
    document.getElementById("renderId").textContent = certId;
    makeQRCode(certId);

    await waitForCertificateAssets();

    statusBox.style.display = "none";
    certWrapper.style.display = "block";
    downloadBtn.style.display = "inline-block";
    downloadPngBtn.style.display = "inline-block";

  } catch (err) {
    console.error(err);
    statusBox.textContent = "حدث خطأ: " + err.message;
  }

  downloadPngBtn.addEventListener("click", async () => {
    downloadPngBtn.disabled = true;
    downloadPngBtn.textContent = "جاري تجهيز PNG عالي الجودة...";

    try {
      const canvas = await renderHighResolutionCanvas();
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
      saveAs(blob, `Certificate-${certId}.png`);
    } catch (err) {
      console.error(err);
      alert("خطأ في إنشاء PNG: " + err.message);
    } finally {
      downloadPngBtn.disabled = false;
      downloadPngBtn.textContent = "🖼️ تنزيل PNG بجودة أصلية";
    }
  });

  downloadBtn.addEventListener("click", async () => {
    downloadBtn.disabled = true;
    downloadPngBtn.disabled = true;
    downloadBtn.textContent = "جاري تجهيز PDF بدقة 6144×4096...";

    try {
      const canvas = await renderHighResolutionCanvas();
      const imgData = canvas.toDataURL("image/png");
      const { jsPDF } = window.jspdf;

      // نفس نسبة التصميم 3:2 — لا A4 ولا تمديد ولا قص.
      const pdfWidth = 297;
      const pdfHeight = 198;

      const pdf = new jsPDF({
        orientation: "landscape",
        unit: "mm",
        format: [pdfWidth, pdfHeight],
        compress: false,
        precision: 16,
        putOnlyUsedFonts: true
      });

      pdf.addImage(
        imgData,
        "PNG",
        0,
        0,
        pdfWidth,
        pdfHeight,
        undefined,
        "NONE"
      );

      pdf.save(`Certificate-${certId}.pdf`);

    } catch (err) {
      console.error("PDF error:", err);
      alert("خطأ في إنشاء ملف PDF: " + err.message);
    } finally {
      downloadBtn.disabled = false;
      downloadPngBtn.disabled = false;
      downloadBtn.textContent = "📄 تنزيل الشهادة PDF بجودة عالية جدًا";
    }
  });
</script>
</body>
</html>
