<!-- =====================================================

===================================================== -->

<script type="module">

  import {
    initializeApp
  }
  from
  "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


  import {
    initializeAuth,
    browserLocalPersistence,
    onAuthStateChanged
  }
  from
  "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


  import {
    getFirestore,
    collection,
    getDocs,
    doc,
    setDoc,
    updateDoc
  }
  from
  "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


  /*
  =========================================================
  FIREBASE CONFIG
  =========================================================
  */

  const firebaseConfig = {

    apiKey:
      "AIzaSyAB-AIOIQH0tOcVXQnUt7pvVnQi0CoFwSo",

    authDomain:
      "menoufia-dental-congress.firebaseapp.com",

    projectId:
      "menoufia-dental-congress",

    storageBucket:
      "menoufia-dental-congress.firebasestorage.app",

    messagingSenderId:
      "20481129823",

    appId:
      "1:20481129823:web:24658314d19bcacf1dcaea"

  };


  /*
  =========================================================
  INITIALIZE FIREBASE
  =========================================================
  */

  const app =
    initializeApp(firebaseConfig);


  const auth =
    initializeAuth(
      app,
      {
        persistence:
          browserLocalPersistence
      }
    );


  const db =
    getFirestore(app);


  /*
  =========================================================
  ORGANIZER UID
  =========================================================
  */

  const ORGANIZER_UID =
    "fS56FR5b2vdd632fpUZWXbJFWwj1";


  /*
  =========================================================
  ELEMENTS
  =========================================================
  */

  const loading =
    document.getElementById(
      "loading"
    );


  const list =
    document.getElementById(
      "participantsList"
    );


  const statusBox =
    document.getElementById(
      "status"
    );


  const searchInput =
    document.getElementById(
      "searchInput"
    );


  let allParticipantsData = [];


  /*
  =========================================================
  AUTHENTICATION
  =========================================================
  */

  onAuthStateChanged(
    auth,
    (user) => {

      if (user) {

        if (
          user.uid ===
          ORGANIZER_UID
        ) {

          loading.innerHTML =
            "تم التحقق. جاري جلب الحاضرين...";

          loadCheckedInParticipants();

        } else {

          loading.innerHTML =
            "خطأ: حساب المنظم غير مطابق (UID: " +
            user.uid +
            ")";

        }

      } else {

        loading.innerHTML =
          "يرجى تسجيل الدخول بحساب المنظم في Firebase أولاً.";

      }

    }
  );


  /*
  =========================================================
  FORMAT DOCTOR NAME
  =========================================================
  */

  function formatDoctorName(
    rawName
  ) {

    const cleanName =
      (rawName || "Participant")
      .trim();


    if (
      /^dr[\/.\s]/i.test(
        cleanName
      )
    ) {

      return cleanName.replace(
        /^dr[\/.\s]+/i,
        "DR/ "
      );

    }


    return "DR/ " + cleanName;

  }


  /*
  =========================================================
  LOAD PARTICIPANTS
  =========================================================
  */

  async function loadCheckedInParticipants() {

    try {

      const participantsSnap =
        await getDocs(
          collection(
            db,
            "participants"
          )
        );


      const certificatesSnap =
        await getDocs(
          collection(
            db,
            "certificates"
          )
        );


      const existingCerts =
        new Map();


      certificatesSnap.forEach(
        (docSnap) => {

          const data =
            docSnap.data();


          if (
            data.participantId
          ) {

            existingCerts.set(
              data.participantId,
              docSnap.id
            );

          }

        }
      );


      allParticipantsData = [];


      participantsSnap.forEach(
        (participantDoc) => {

          const data =
            participantDoc.data();


          if (
            data.attendance === true
          ) {

            allParticipantsData.push({

              participantId:
                participantDoc.id,

              data:
                data,

              certId:
                existingCerts.get(
                  participantDoc.id
                )

            });

          }

        }
      );


      loading.style.display =
        "none";


      renderFilteredList("");

    }

    catch (error) {

      console.error(error);

      loading.textContent =
        "حدث خطأ أثناء الجلب: " +
        error.message;

    }

  }


  /*
  =========================================================
  SEARCH
  =========================================================
  */

  function renderFilteredList(
    query
  ) {

    list.innerHTML = "";


    const lowerQuery =
      query
        .toLowerCase()
        .trim();


    const filtered =
      allParticipantsData.filter(
        (item) => {

          const name =
            (
              item.data.fullName ||
              ""
            )
            .toLowerCase();


          const email =
            (
              item.data.email ||
              ""
            )
            .toLowerCase();


          return (
            name.includes(
              lowerQuery
            ) ||
            email.includes(
              lowerQuery
            )
          );

        }
      );


    if (
      filtered.length === 0
    ) {

      list.innerHTML =
        "<p style='text-align:center;color:#777;'>لا توجد نتائج مطابقة للبحث.</p>";

      return;

    }


    filtered.forEach(
      (item) => {

        renderRow(
          item.participantId,
          item.data,
          item.certId
        );

      }
    );

  }


  searchInput.addEventListener(
    "input",
    (e) => {

      renderFilteredList(
        e.target.value
      );

    }
  );


  /*
  =========================================================
  RENDER PARTICIPANT
  =========================================================
  */

  function renderRow(
    participantId,
    data,
    certId
  ) {

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "participant";


    /*
    INFO
    */

    const info =
      document.createElement(
        "div"
      );


    info.className =
      "participant-info";


    const name =
      document.createElement(
        "div"
      );


    name.className =
      "name";


    name.textContent =
      formatDoctorName(
        data.fullName
      );


    const email =
      document.createElement(
        "div"
      );


    email.className =
      "email";


    email.textContent =
      data.email ||
      "بدون بريد إلكتروني";


    info.appendChild(
      name
    );


    info.appendChild(
      email
    );


    /*
    ACTIONS
    */

    const actions =
      document.createElement(
        "div"
      );


    actions.className =
      "actions-group";


    /*
    =======================================================
    CERTIFICATE EXISTS
    =======================================================
    */

    if (certId) {

      /*
      VIEW
      */

      const viewLink =
        document.createElement(
          "a"
        );


      viewLink.className =
        "view-btn";


      viewLink.textContent =
        "عرض الشهادة";


      viewLink.href =
        "certificate.html?id=" +
        encodeURIComponent(
          certId
        );


      viewLink.target =
        "_blank";


      actions.appendChild(
        viewLink
      );


      /*
      DOWNLOAD PNG
      */

      const downloadBtn =
        document.createElement(
          "button"
        );


      downloadBtn.className =
        "view-btn btn-download-pdf";


      downloadBtn.textContent =
        "📥 تنزيل PNG";


      downloadBtn.onclick =
        async () => {

          downloadBtn.disabled =
            true;


          downloadBtn.textContent =
            "⏳ جاري الحفظ...";


          try {

            await generateAndDownloadSingle(
              certId,
              formatDoctorName(
                data.fullName
              )
            );

          }

          catch (error) {

            console.error(error);

            alert(
              "حدث خطأ أثناء تنزيل الشهادة:\n" +
              error.message
            );

          }


          downloadBtn.disabled =
            false;


          downloadBtn.textContent =
            "📥 تنزيل PNG";

        };


      actions.appendChild(
        downloadBtn
      );


      /*
      =====================================================
      DOWNLOAD PDF
      =====================================================
      */

      const downloadPdfBtn =
        document.createElement(
          "button"
        );


      downloadPdfBtn.className =
        "view-btn";


      downloadPdfBtn.style.background =
        "#7c3aed";


      downloadPdfBtn.textContent =
        "📄 تنزيل PDF";


      downloadPdfBtn.onclick =
        async () => {

          downloadPdfBtn.disabled =
            true;


          downloadPdfBtn.textContent =
            "⏳ جاري إنشاء PDF...";


          try {

            await generateAndDownloadPdf(
              certId,
              formatDoctorName(
                data.fullName
              )
            );

          }

          catch (error) {

            console.error(error);

            alert(
              "حدث خطأ أثناء إنشاء PDF:\n" +
              error.message
            );

          }


          downloadPdfBtn.disabled =
            false;


          downloadPdfBtn.textContent =
            "📄 تنزيل PDF";

        };


      actions.appendChild(
        downloadPdfBtn
      );


      /*
      =====================================================
      EMAIL
      =====================================================
      */

      const emailBtn =
        document.createElement(
          "button"
        );


      emailBtn.className =
        "view-btn btn-email-single";


      emailBtn.textContent =
        "📧 إرسال الإيميل";


      emailBtn.onclick =
        () => {

          if (!data.email) {

            alert(
              "هذا المستخدم ليس لديه بريد إلكتروني مسجل."
            );

            return;

          }


          openGmailCompose(
            certId,
            formatDoctorName(
              data.fullName
            ),
            data.email
          );


          /*
          تسجيل وقت فتح رسالة Gmail
          */

          updateDoc(
            doc(
              db,
              "certificates",
              certId
            ),
            {

              emailOpenedAt:
                new Date().toISOString(),

              emailOpenedTo:
                data.email

            }
          )
          .catch(
            (err) => {

              console.warn(
                "تعذر تسجيل حالة الإيميل:",
                err
              );

            }
          );


          emailBtn.classList.add(
            "sent"
          );


          emailBtn.textContent =
            "✅ تم فتح Gmail";

        };


      actions.appendChild(
        emailBtn
      );


      /*
      EMAIL STATUS
      */

      if (
        data.emailSentAt
      ) {

        const emailStatus =
          document.createElement(
            "div"
          );


        emailStatus.className =
          "email-status";


        emailStatus.textContent =
          "✓ تم التعامل مع البريد سابقًا";


        info.appendChild(
          emailStatus
        );

      }

    }

    else {

      /*
      =====================================================
      CREATE CERTIFICATE
      =====================================================
      */

      const createBtn =
        document.createElement(
          "button"
        );


      createBtn.className =
        "view-btn btn-create";


      createBtn.textContent =
        "إنشاء الشهادة";


      createBtn.onclick =
        async () => {

          createBtn.disabled =
            true;


          createBtn.textContent =
            "جاري الإنشاء...";


          try {

            const certificatesSnap =
              await getDocs(
                collection(
                  db,
                  "certificates"
                )
              );


            const nextNum =
              certificatesSnap.size +
              1;


            const certificateId =
              "MDC-2026-" +
              String(
                nextNum
              )
              .padStart(
                4,
                "0"
              );


            const finalName =
              formatDoctorName(
                data.fullName
              );


            await setDoc(
              doc(
                db,
                "certificates",
                certificateId
              ),
              {

                fullName:
                  finalName,

                participantId:
                  participantId,

                email:
                  data.email || "",

                institution:
                  data.institution || "",

                certificateId:
                  certificateId,

                createdAt:
                  new Date()
                    .toISOString()

              }
            );


            await loadCheckedInParticipants();

          }

          catch (err) {

            console.error(err);

            alert(
              "خطأ: " +
              err.message
            );


            createBtn.disabled =
              false;


            createBtn.textContent =
              "إنشاء الشهادة";

          }

        };


      actions.appendChild(
        createBtn
      );

    }


    row.appendChild(
      info
    );


    row.appendChild(
      actions
    );


    list.appendChild(
      row
    );

  }


  /*
  =========================================================
  OPEN GMAIL
  =========================================================
  */

  function openGmailCompose(
    certId,
    fullName,
    email
  ) {

    const certUrl =
      new URL(
        "certificate.html?id=" +
        encodeURIComponent(
          certId
        ),
        window.location.href
      ).href;


    const subject =
      encodeURIComponent(
        "Certificate of Attendance - Menoufia Dental Congress"
      );


    const body =
      encodeURIComponent(
        `Dear ${fullName},

We are pleased to send you your Certificate of Attendance for the Menoufia Dental Congress.

You can view and download your certificate using the following link:

${certUrl}

Certificate ID:
${certId}

Best regards,
Menoufia Dental Congress Organizing Committee`
      );


    const gmailUrl =
      "https://mail.google.com/mail/?view=cm&fs=1" +
      "&to=" +
      encodeURIComponent(
        email
      ) +
      "&su=" +
      subject +
      "&body=" +
      body;


    window.open(
      gmailUrl,
      "_blank"
    );

  }


  /*
  =========================================================
  GENERATE PNG
  =========================================================
  */

  async function generateAndDownloadSingle(
    certId,
    fullName
  ) {

    const canvas =
      await renderCertificateCanvas(
        certId,
        fullName
      );


    canvas.toBlob(
      (blob) => {

        if (!blob) {

          alert(
            "تعذر إنشاء صورة الشهادة."
          );

          return;

        }


        saveAs(
          blob,
          `Certificate-${certId}.png`
        );

      },
      "image/png"
    );

  }


  /*
  =========================================================
  RENDER CERTIFICATE
  =========================================================
  */

  async function renderCertificateCanvas(
    certId,
    fullName
  ) {

    const renderDiv =
      document.getElementById(
        "renderCert"
      );


    document.getElementById(
      "renderName"
    ).textContent =
      fullName;


    document.getElementById(
      "renderId"
    ).textContent =
      certId;


    /*
    QR
    */

    const qrDiv =
      document.getElementById(
        "renderQr"
      );


    qrDiv.innerHTML =
      "";


    /*
    رابط الشهادة
    */

    const verificationUrl =
      new URL(
        "certificate.html?id=" +
        encodeURIComponent(
          certId
        ),
        window.location.href
      ).href;


    new QRCode(
      qrDiv,
      {

        text:
          verificationUrl,

        width:
          150,

        height:
          150,

        correctLevel:
          QRCode.CorrectLevel.H

      }
    );


    /*
    انتظار QR
    */

    await new Promise(
      (resolve) =>
        setTimeout(
          resolve,
          400
        )
    );


    /*
    Canvas
    */

    return await html2canvas(
      renderDiv,
      {

        scale:
          3,

        useCORS:
          true,

        allowTaint:
          false,

        backgroundColor:
          null,

        logging:
          false

      }
    );

  }


  /*
  =========================================================
  CREATE PDF BASE64
  =========================================================
  */

  async function createCertificatePdfBase64(
    certId,
    fullName
  ) {

    const canvas =
      await renderCertificateCanvas(
        certId,
        fullName
      );


    const {
      jsPDF
    } =
      window.jspdf;


    /*
    المقاس الأصلي
    1448 × 1086
    */

    const pdfWidth =
      297;


    const pdfHeight =
      pdfWidth *
      (
        1086 /
        1448
      );


    const pdf =
      new jsPDF(
        {

          orientation:
            "landscape",

          unit:
            "mm",

          format:
            [
              pdfWidth,
              pdfHeight
            ],

          compress:
            false

        }
      );


    const imgData =
      canvas.toDataURL(
        "image/png"
      );


    pdf.addImage(
      imgData,
      "PNG",
      0,
      0,
      pdfWidth,
      pdfHeight,
      undefined,
      "NONE"
    );


    return pdf;

  }


  /*
  =========================================================
  DOWNLOAD PDF
  =========================================================
  */

  async function generateAndDownloadPdf(
    certId,
    fullName
  ) {

    const pdf =
      await createCertificatePdfBase64(
        certId,
        fullName
      );


    pdf.save(
      `Certificate-${certId}.pdf`
    );

  }

  /*
  =========================================================
  CREATE ALL MISSING CERTIFICATES
  =========================================================
  */

  document
    .getElementById(
      "generateAllBtn"
    )
    .addEventListener(
      "click",
      async () => {

        const btn =
          document.getElementById(
            "generateAllBtn"
          );


        btn.disabled =
          true;


        btn.textContent =
          "جاري الفحص وإنشاء الشهادات...";


        try {

          const participantsSnap =
            await getDocs(
              collection(
                db,
                "participants"
              )
            );


          const certificatesSnap =
            await getDocs(
              collection(
                db,
                "certificates"
              )
            );


          /*
          الشهادات الموجودة
          */

          const existingCerts =
            new Map();


          certificatesSnap.forEach(
            (docSnap) => {

              const d =
                docSnap.data();


              if (
                d.participantId
              ) {

                existingCerts.set(
                  d.participantId,
                  docSnap.id
                );

              }

            }
          );


          let totalCertsCount =
            certificatesSnap.size;


          let createdCount =
            0;


          /*
          إنشاء شهادات الحاضرين
          */

          for (
            const participantDoc
            of participantsSnap.docs
          ) {

            const data =
              participantDoc.data();


            const participantId =
              participantDoc.id;


            if (
              data.attendance === true &&
              !existingCerts.has(
                participantId
              )
            ) {

              totalCertsCount++;


              const certificateId =
                "MDC-2026-" +
                String(
                  totalCertsCount
                )
                .padStart(
                  4,
                  "0"
                );


              const finalName =
                formatDoctorName(
                  data.fullName
                );


              await setDoc(
                doc(
                  db,
                  "certificates",
                  certificateId
                ),
                {

                  fullName:
                    finalName,

                  participantId:
                    participantId,

                  email:
                    data.email || "",

                  institution:
                    data.institution || "",

                  certificateId:
                    certificateId,

                  createdAt:
                    new Date()
                      .toISOString()

                }
              );


              existingCerts.set(
                participantId,
                certificateId
              );


              createdCount++;

            }

          }


          statusBox.className =
            "status success";


          statusBox.textContent =
            `تم بنجاح إنشاء ${createdCount} شهادة جديدة.`;


          statusBox.style.display =
            "block";


          await loadCheckedInParticipants();

        }

        catch (error) {

          console.error(error);


          statusBox.className =
            "status error";


          statusBox.textContent =
            "حدث خطأ: " +
            error.message;


          statusBox.style.display =
            "block";

        }

        finally {

          btn.disabled =
            false;


          btn.textContent =
            "🚀 فحص الحاضرين وإنشاء الشهادات المفقودة دفعة واحدة";

        }

      }
    );

</script>
