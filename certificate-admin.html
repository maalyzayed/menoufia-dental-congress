<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إصدار الشهادات التلقائي | مؤتمر المنوفية لطب الأسنان</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
      padding: 30px 15px;
    }
    .container { width: 100%; max-width: 1000px; margin: auto; }
    .header {
      background: #173b63;
      color: white;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      margin-bottom: 25px;
    }
    .header h1 { margin: 0 0 8px; }
    .header p { margin: 0; opacity: 0.85; }
    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .card h2 { color: #173b63; margin-top: 0; }
    .participant {
      border: 1px solid #e0e5eb;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }
    .participant-info { flex: 1; min-width: 250px; }
    .name { font-size: 18px; font-weight: bold; color: #173b63; }
    .email { color: #777; margin-top: 5px; font-size: 14px; }
    .actions-group { display: flex; gap: 8px; flex-wrap: wrap; }
    button, .view-btn {
      border: none;
      border-radius: 9px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      font-size: 13px;
    }
    .btn-main {
      background: #c9a227;
      color: white;
      font-size: 15px;
      padding: 14px 24px;
      width: 100%;
      text-align: center;
      margin-bottom: 12px;
    }
    .top-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-top { background: #475569; color: white; flex: 1; padding: 12px; text-align: center; font-size: 14px; }
    .btn-email-all { background: #0d9488; color: white; flex: 1; padding: 12px; text-align: center; font-size: 14px; }
    .view-btn { background: #173b63; color: white; }
    .btn-create { background: #027a48; color: white; }
    .btn-email-single { background: #0d9488; color: white; }
    .status { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; }
    .success { background: #ecfdf3; color: #027a48; }
    .error { background: #fff0f0; color: #b42318; }
    .loading { text-align: center; padding: 25px; color: #777; }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🎓 إصدار الشهادات التلقائي</h1>
    <p>Menoufia Dental Congress</p>
  </div>

  <div class="card" style="text-align: center;">
    <button id="generateAllBtn" class="btn-main">
      🚀 فحص الحاضرين وإنشاء الشهادات المفقودة دفعة واحدة
    </button>
    <div class="top-actions">
      <button id="downloadAllBtn" class="btn-top">📥 تنزيل / عرض كل الشهادات</button>
      <button id="sendAllEmailBtn" class="btn-email-all">📧 إرسال عبر الإيميل للجميع</button>
    </div>
  </div>

  <div class="card">
    <h2>قائمة المشاركين الحاضرين</h2>
    <div id="loading" class="loading">جاري تحميل بيانات الحاضرين...</div>
    <div id="participantsList"></div>
    <div id="status" class="status"></div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
  import { initializeAuth, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
  
  const firebaseConfig = {
    apiKey: "AIzaSyAB-AIOIQH0tOcVXQnUt7pvVnQi0CoFwSo",
    authDomain: "menoufia-dental-congress.firebaseapp.com",
    projectId: "menoufia-dental-congress",
    storageBucket: "menoufia-dental-congress.firebasestorage.app",
    messagingSenderId: "20481129823",
    appId: "1:20481129823:web:24658314d19bcacf1dcaea"
  };

  const app = initializeApp(firebaseConfig);
  const auth = initializeAuth(app, { persistence: browserLocalPersistence });
  const db = getFirestore(app);
  const ORGANIZER_UID = "fS56FR5b2vdd632fpUZWXbJFWwj1";

  const loading = document.getElementById("loading");
  const list = document.getElementById("participantsList");
  const statusBox = document.getElementById("status");

  onAuthStateChanged(auth, (user) => {
    if (user) {
      if (user.uid === ORGANIZER_UID) {
        loading.innerHTML = "تم التحقق. جاري جلب الحاضرين...";
        loadCheckedInParticipants();
      } else {
        loading.innerHTML = "خطأ: حساب المنظم غير مطبق (UID: " + user.uid + ")";
      }
    } else {
      loading.innerHTML = "يرجى تسجيل الدخول بحساب المنظم في Firebase أولاً.";
    }
  });

  function formatDoctorName(rawName) {
    const cleanName = (rawName || "Participant").trim();
    if (/^dr[\/.\s]/i.test(cleanName)) {
      return cleanName.replace(/^dr[\/.\s]+/i, "DR/ ");
    }
    return "DR/ " + cleanName;
  }

  async function loadCheckedInParticipants() {
    try {
      list.innerHTML = "";
      const participantsSnap = await getDocs(collection(db, "participants"));
      const certificatesSnap = await getDocs(collection(db, "certificates"));
      
      const existingCerts = new Map();
      certificatesSnap.forEach(docSnap => {
        const data = docSnap.data();
        if (data.participantId) {
          existingCerts.set(data.participantId, docSnap.id);
        }
      });

      loading.style.display = "none";
      let count = 0;

      participantsSnap.forEach(participantDoc => {
        const data = participantDoc.data();
        if (data.attendance === true) {
          count++;
          const participantId = participantDoc.id;
          const certId = existingCerts.get(participantId);
          renderRow(participantId, data, certId);
        }
      });

      if (count === 0) {
        list.innerHTML = "<p style='text-align: center; color: #777;'>لا يوجد أي مشارك قام بتسجيل الحضور (Check-in).</p>";
      }
    } catch (error) {
      console.error(error);
      loading.textContent = "حدث خطأ أثناء الجلب: " + error.message;
    }
  }

  function renderRow(participantId, data, certId) {
    const row = document.createElement("div");
    row.className = "participant";

    const info = document.createElement("div");
    info.className = "participant-info";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = formatDoctorName(data.fullName);

    const email = document.createElement("div");
    email.className = "email";
    email.textContent = data.email || "بدون بريد إلكتروني";

    info.appendChild(name);
    info.appendChild(email);

    const actions = document.createElement("div");
    actions.className = "actions-group";

    if (certId) {
      // زر عرض الشهادة
      const viewLink = document.createElement("a");
      viewLink.className = "view-btn";
      viewLink.textContent = "عرض الشهادة";
      viewLink.href = "certificate.html?id=" + encodeURIComponent(certId);
      viewLink.target = "_blank";
      actions.appendChild(viewLink);

      // زر إرسال إيميل فردي
      const emailBtn = document.createElement("button");
      emailBtn.className = "view-btn btn-email-single";
      emailBtn.textContent = "📧 إرسال إيميل";
      emailBtn.onclick = () => {
        if (!data.email) {
          alert("هذا المستخدم ليس لديه بريد إلكتروني مسجل.");
          return;
        }
        const certUrl = window.location.origin + "/certificate.html?id=" + encodeURIComponent(certId);
        const subject = encodeURIComponent("شهادة حضور مؤتمر المنوفية لطب الأسنان");
        const body = encodeURIComponent(`مرحباً ${formatDoctorName(data.fullName)},\n\nيسعدنا إرسال شهادة حضورك الخاصة بمؤتمر المنوفية لطب الأسنان.\nيمكنك معاينة وتنزيل شهادتك عبر الرابط التالي:\n${certUrl}\n\nمع تحيات اللجنة المنظمة.`);
        window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${data.email}&su=${subject}&body=${body}`, '_blank');
      };
      actions.appendChild(emailBtn);
    } else {
      // زر إنشاء الشهادة إذا لم تكن موجودة
      const createBtn = document.createElement("button");
      createBtn.className = "view-btn btn-create";
      createBtn.textContent = "إنشاء الشهادة";
      createBtn.onclick = async () => {
        createBtn.disabled = true;
        createBtn.textContent = "جاري الإنشاء...";
        try {
          const certificatesSnap = await getDocs(collection(db, "certificates"));
          const nextNum = certificatesSnap.size + 1;
          const certificateId = "MDC-2026-" + String(nextNum).padStart(4, "0");
          const finalName = formatDoctorName(data.fullName);

          await setDoc(doc(db, "certificates", certificateId), {
            fullName: finalName,
            participantId: participantId,
            email: data.email || "",
            institution: data.institution || "",
            certificateId: certificateId,
            createdAt: new Date().toISOString()
          });
          loadCheckedInParticipants();
        } catch (err) {
          alert("خطأ: " + err.message);
          createBtn.disabled = false;
          createBtn.textContent = "إنشاء الشهادة";
        }
      };
      actions.appendChild(createBtn);
    }

    row.appendChild(info);
    row.appendChild(actions);
    list.appendChild(row);
  }

  // زر إرسال جماعي للإيميلات عبر Gmail Web
  document.getElementById("sendAllEmailBtn").addEventListener("click", async () => {
    if (!confirm("هل تريد فتح رسائل البريد الإلكتروني للمشاركين الحاضرين؟")) return;
    const certificatesSnap = await getDocs(collection(db, "certificates"));
    let count = 0;
    certificatesSnap.forEach(docSnap => {
      const data = docSnap.data();
      if (data.email) {
        count++;
        const certUrl = window.location.origin + "/certificate.html?id=" + encodeURIComponent(docSnap.id);
        const subject = encodeURIComponent("شهادة حضور مؤتمر المنوفية لطب الأسنان");
        const body = encodeURIComponent(`مرحباً ${data.fullName},\n\nإليك رابط شهادة حضورك في مؤتمر المنوفية لطب الأسنان:\n${certUrl}\n\nمع تحيات اللجنة المنظمة.`);
        setTimeout(() => {
          window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${data.email}&su=${subject}&body=${body}`, '_blank');
        }, count * 600);
      }
    });
    alert(`تم فتح تبويبات الإرسال لـ ${count} مشارك.`);
  });

  // زر تنزيل/عرض كل الشهادات دفعة واحدة
  document.getElementById("downloadAllBtn").addEventListener("click", async () => {
    const certificatesSnap = await getDocs(collection(db, "certificates"));
    if (certificatesSnap.empty) {
      alert("لا توجد شهادات مسجلة بعد!");
      return;
    }
    if(!confirm(`سيتم فتح ${certificatesSnap.size} صفحة للشهادات لتتمكن من حفظها. هل أنت متأكد؟`)) return;
    let i = 0;
    certificatesSnap.forEach(docSnap => {
      i++;
      const certId = docSnap.id;
      setTimeout(() => {
        window.open(`certificate.html?id=${encodeURIComponent(certId)}`, '_blank');
      }, i * 400);
    });
  });

  // زر إنشاء الشهادات المفقودة دفعة واحدة
  document.getElementById("generateAllBtn").addEventListener("click", async () => {
    const btn = document.getElementById("generateAllBtn");
    btn.disabled = true;
    btn.textContent = "جاري الفحص وإنشاء الشهادات...";

    try {
      const participantsSnap = await getDocs(collection(db, "participants"));
      const certificatesSnap = await getDocs(collection(db, "certificates"));

      const existingCerts = new Map();
      certificatesSnap.forEach(docSnap => {
        const d = docSnap.data();
        if (d.participantId) existingCerts.set(d.participantId, docSnap.id);
      });

      let totalCertsCount = certificatesSnap.size;
      let createdCount = 0;

      for (const participantDoc of participantsSnap.docs) {
        const data = participantDoc.data();
        const participantId = participantDoc.id;

        if (data.attendance === true && !existingCerts.has(participantId)) {
          totalCertsCount++;
          const certificateId = "MDC-2026-" + String(totalCertsCount).padStart(4, "0");
          const finalName = formatDoctorName(data.fullName);

          await setDoc(doc(db, "certificates", certificateId), {
            fullName: finalName,
            participantId: participantId,
            email: data.email || "",
            institution: data.institution || "",
            certificateId: certificateId,
            createdAt: new Date().toISOString()
          });

          existingCerts.set(participantId, certificateId);
          createdCount++;
        }
      }

      statusBox.className = "status success";
      statusBox.textContent = `تم بنجاح إنشاء ${createdCount} شهادة جديدة.`;
      statusBox.style.display = "block";

      setTimeout(() => {
        loadCheckedInParticipants();
        btn.disabled = false;
        btn.textContent = "🚀 فحص الحاضرين وإنشاء الشهادات المفقودة دفعة واحدة";
      }, 1500);

    } catch (error) {
      console.error(error);
      statusBox.className = "status error";
      statusBox.textContent = "حدث خطأ: " + error.message;
      statusBox.style.display = "block";
      btn.disabled = false;
      btn.textContent = "🚀 فحص الحاضرين وإنشاء الشهادات المفقودة دفعة واحدة";
    }
  });
</script>

</body>
</html>
