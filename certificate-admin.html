<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate Management | Menoufia Dental Congress</title>
  <!-- مكتبة html2canvas لتحويل الشهادة إلى صورة وتحميلها -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: auto;
    }

    .header {
      background: #173b63;
      color: white;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0 0 8px;
    }

    .header p {
      margin: 0;
      opacity: 0.85;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .card h2 {
      color: #173b63;
      margin-top: 0;
    }

    .participant {
      border: 1px solid #e0e5eb;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .participant-info {
      flex: 1;
      min-width: 250px;
    }

    .name {
      font-size: 18px;
      font-weight: bold;
      color: #173b63;
    }

    .email {
      color: #777;
      margin-top: 5px;
      font-size: 14px;
    }

    .actions-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button,
    .view-button,
    .download-button {
      border: none;
      border-radius: 9px;
      padding: 11px 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
    }

    .generate {
      background: #173b63;
      color: white;
    }

    .view-button {
      background: #c9a227;
      color: white;
    }

    .download-button {
      background: #027a48;
      color: white;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #ecfdf3;
      color: #027a48;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #173b63;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <a href="admin-panel.html" class="back">
    ← Back to Organizer Panel
  </a>

  <div class="header">
    <h1>🎓 Certificate Management</h1>
    <p>Menoufia Dental Congress</p>
  </div>

  <!-- الأزرار الرئيسية في الأعلى -->
  <div class="card" style="text-align: center; margin-bottom: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
    <button id="generateAllBtn" class="generate" style="background: #c9a227; font-size: 15px; padding: 12px 20px;">
      🚀 إصدار وإرسال الشهادات لكل الحاضرين دفعة واحدة
    </button>
    <button id="downloadAllBtn" class="download-button" style="font-size: 15px; padding: 12px 20px;">
      📦 تحميل كل الشهادات (صور) دفعة واحدة
    </button>
  </div>

  <div class="card">
    <h2>Participants (Checked-in)</h2>

    <div id="loading" class="loading">
      Loading participants...
    </div>

    <div id="participantsList"></div>

    <div id="status" class="status"></div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
  import { initializeAuth, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, setDoc, addDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
  
  const firebaseConfig = {
    apiKey: "AIzaSyAB-AIOIQh0tOcVXQnUt7pvVnQi0CoFwSo",
    authDomain: "menoufia-dental-congress.firebaseapp.com",
    projectId: "menoufia-dental-congress",
    storageBucket: "menoufia-dental-congress.firebasestorage.app",
    messagingSenderId: "20481129823",
    appId: "1:20481129823:web:24658314d19bcacf1dcaea"
  };

  const app = initializeApp(firebaseConfig);
  const auth = initializeAuth(app, { persistence: browserLocalPersistence });
  const db = getFirestore(app);

  const ORGANIZER_UID = "fS56FR5b2vdd632fpUZWXbJFWwj1";

  const loading = document.getElementById("loading");
  const list = document.getElementById("participantsList");
  const status = document.getElementById("status");

 onAuthStateChanged(auth, (user) => {
    if (user) {
      if (user.uid === ORGANIZER_UID) {
        loading.innerHTML = "Organizer verified. Loading participants...";
        loadParticipants();
      } else {
        loading.innerHTML = "Wrong Organizer UID.<br><br>Logged UID: " + user.uid;
      }
    } else {
      loading.innerHTML = "NO USER — Firebase Auth did not find a login.";
    }
  });

  async function loadParticipants() {
    try {
      const snapshot = await getDocs(collection(db, "participants"));
      loading.style.display = "none";

      if (snapshot.empty) {
        list.innerHTML = "<p>No participants found.</p>";
        return;
      }

      let checkedInCount = 0;

      snapshot.forEach(participantDoc => {
        const data = participantDoc.data();
        if (data.attendance !== true) return;

        checkedInCount++;
        const participantId = participantDoc.id;
        createParticipantRow(participantId, data);
      });

      if (checkedInCount === 0) {
        list.innerHTML = "<p>No participants have completed check-in yet.</p>";
      }

    } catch (error) {
      console.error(error);
      loading.textContent = "Error: " + error.code + " — " + error.message;
    }
  }

  function createParticipantRow(participantId, data) {
    const row = document.createElement("div");
    row.className = "participant";
    row.dataset.participantId = participantId;
    row.dataset.fullName = data.fullName || "";

    const info = document.createElement("div");
    info.className = "participant-info";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = data.fullName || "Unnamed Participant";

    const email = document.createElement("div");
    email.className = "email";
    email.textContent = data.email || participantId;

    info.appendChild(name);
    info.appendChild(email);

    const actions = document.createElement("div");
    actions.className = "actions-group";

    const button = document.createElement("button");
    button.className = "generate";
    button.textContent = "🎓 Generate";

    button.addEventListener("click", () => {
      generateCertificate(participantId, data, button, row);
    });

    actions.appendChild(button);
    row.appendChild(info);
    row.appendChild(actions);
    list.appendChild(row);

    // التحقق المسبق إذا كانت الشهادة موجودة بالفعل لعرض أزرار العرض والتحميل مباشرة
    checkExistingCertificateOnLoad(participantId, row);
  }

  async function checkExistingCertificateOnLoad(participantId, row) {
    try {
      const certificatesSnapshot = await getDocs(collection(db, "certificates"));
      certificatesSnapshot.forEach(certificateDoc => {
        const data = certificateDoc.data();
        if (data.participantId === participantId) {
          const certId = certificateDoc.id;
          const genBtn = row.querySelector(".generate");
          if (genBtn) {
            genBtn.textContent = "Created";
            genBtn.disabled = true;
          }
          showCertificateButtons(certId, row);
        }
      });
    } catch (e) {
      console.error(e);
    }
  }

  function showCertificateButtons(certificateId, row) {
    const actions = row.querySelector(".actions-group");
    if (actions.querySelector(".view-button")) return;

    const viewLink = document.createElement("a");
    viewLink.className = "view-button";
    viewLink.textContent = "View";
    viewLink.href = "certificate.html?id=" + encodeURIComponent(certificateId);
    viewLink.target = "_blank";

    const downloadBtn = document.createElement("button");
    downloadBtn.className = "download-button";
    downloadBtn.textContent = "📥 Download";
    downloadBtn.addEventListener("click", () => downloadCertificateImage(certificateId, row.dataset.fullName));

    actions.appendChild(viewLink);
    actions.appendChild(downloadBtn);
  }

// دالة تحميل أو عرض الشهادة بشكل مباشر ومضمون
  function downloadCertificateImage(certificateId, fullName) {
    const certUrl = "certificate.html?id=" + encodeURIComponent(certificateId);
    
    // فتح الشهادة في نافذة جديدة
    const win = window.open(certUrl, '_blank');
    
    if (win) {
      showSuccess(`تم فتح شهادة ${fullName} في نافذة جديدة. يمكنك الضغط فيها على Ctrl + P ثم اختيار Save as PDF لحفظها.`);
    } else {
      showError("يرجى السماح للنوافذ المنبثقة (Pop-ups) بالعمل في متصفحك لكي يتم فتح الشهادة.");
    }
  }

  async function generateCertificate(participantId, participantData, button, row) {
    button.disabled = true;
    button.textContent = "Generating...";

    try {
      const certificatesSnapshot = await getDocs(collection(db, "certificates"));
      let existingCertificateId = null;

      certificatesSnapshot.forEach(certificateDoc => {
        const data = certificateDoc.data();
        if (data.participantId === participantId) {
          existingCertificateId = certificateDoc.id;
        }
      });

      if (existingCertificateId) {
        showCertificateButtons(existingCertificateId, row);
        button.textContent = "Created";
        return;
      }

      const certificatesCount = certificatesSnapshot.size;
      const number = certificatesCount + 1;
      const certificateId = "MDC-2026-" + String(number).padStart(4, "0");

      await setDoc(doc(db, "certificates", certificateId), {
        fullName: participantData.fullName || "Participant",
        participantId: participantId,
        email: participantData.email || "",
        institution: participantData.institution || "",
        certificateId: certificateId,
        createdAt: new Date().toISOString()
      });

      showSuccess("Certificate created successfully: " + certificateId);
      showCertificateButtons(certificateId, row);

      button.textContent = "Created";
      button.disabled = true;

    } catch (error) {
      console.error("Certificate generation error:", error);
      showError("Error: " + error.code + " — " + error.message);
      button.disabled = false;
      button.textContent = "🎓 Generate";
    }
  }

  // الإصدار الجماعي
  document.getElementById("generateAllBtn").addEventListener("click", generateAllCheckedInCertificates);

  async function generateAllCheckedInCertificates() {
    const btn = document.getElementById("generateAllBtn");
    btn.disabled = true;
    btn.textContent = "جاري الإصدار والإرسال...";
    
    try {
      const participantsSnapshot = await getDocs(collection(db, "participants"));
      const certificatesSnapshot = await getDocs(collection(db, "certificates"));
      
      const existingCerts = new Map();
      certificatesSnapshot.forEach(docSnap => {
        const d = docSnap.data();
        existingCerts.set(d.participantId, docSnap.id);
      });

      let countCreated = 0;
      let totalCount = certificatesSnapshot.size;

      for (const participantDoc of participantsSnapshot.docs) {
        const data = participantDoc.data();
        const participantId = participantDoc.id;

        if (data.attendance !== true) continue;

        let certificateId = existingCerts.get(participantId);

        if (!certificateId) {
          totalCount++;
          certificateId = "MDC-2026-" + String(totalCount).padStart(4, "0");

          await setDoc(doc(db, "certificates", certificateId), {
            fullName: data.fullName || "Participant",
            participantId: participantId,
            email: data.email || "",
            institution: data.institution || "",
            certificateId: certificateId,
            createdAt: new Date().toISOString()
          });
          
          existingCerts.set(participantId, certificateId);
          countCreated++;
        }

        if (data.email) {
          const certificateLink = window.location.origin + "/certificate.html?id=" + encodeURIComponent(certificateId);
          await addDoc(collection(db, "mail"), {
            to: data.email,
            message: {
              subject: "شهادة حضور مؤتمر المنوفية لطب الأسنان - Menoufia Dental Congress",
              html: `
                <div dir="rtl" style="font-family: Arial, sans-serif; padding: 20px; color: #102c52;">
                  <h2>مرحباً د. ${data.fullName || "المشارِك"}،</h2>
                  <p>شكراً لحضورك الفعاليات المتميزة لـ <b>مؤتمر المنوفية لطب الأسنان (Menoufia Dental Congress)</b>.</p>
                  <p>يسعدنا أن نفيدكم بأنه تم إصدار شهادة الحضور الخاصة بكم بنجاح.</p>
                  <p style="margin: 20px 0;">
                    <a href="${certificateLink}" style="background: #173b63; color: white; padding: 12px 20px; text-decoration: none; border-radius: 8px; font-weight: bold;">عرض وتحميل الشهادة</a>
                  </p>
                  <p>مع خالص تحياتنا،<br>لجنة تنظيم المؤتمر</p>
                </div>
              `
            }
          });
        }
      }

      showSuccess(`تم بنجاح! تم إنشاء ${countCreated} شهادة جديدة وإرسالها للحاضرين.`);
      btn.textContent = "✅ تمت العملية بنجاح";
      location.reload(); // تحديث الصفحة لتحديث الأزرار لكل الحاضرين

    } catch (error) {
      console.error(error);
      showError("حدث خطأ: " + error.message);
      btn.disabled = false;
      btn.textContent = "🚀 إصدار وإرسال الشهادات لكل الحاضرين دفعة واحدة";
    }
  }

// زر تحميل الكل - عرض الروابط بدلاً من فتحها تلقائياً
  document.getElementById("downloadAllBtn").addEventListener("click", () => {
    const viewButtons = document.querySelectorAll(".view-button");
    if (viewButtons.length === 0) {
      showError("لا توجد شهادات صادرة بعد! يرجى إصدار الشهادات أولاً.");
      return;
    }

    // إنشاء منطقة عرض الروابط
    let htmlContent = "<strong>تم تجهيز الروابط (اضغط لفتح كل شهادة):</strong><br><br>";
    viewButtons.forEach((btn, index) => {
      htmlContent += `<a href="${btn.href}" target="_blank" style="color: #173b63; display: block; margin-bottom: 5px;">شهادة رقم ${index + 1}</a>`;
    });

    status.innerHTML = htmlContent;
    status.className = "status success";
    status.style.display = "block";
    
    // محاولة فتح أول 3 شهادات فقط لتقليل احتمالية الحظر
    viewButtons.forEach((btn, index) => {
      if (index < 3) {
        setTimeout(() => window.open(btn.href, '_blank'), index * 500);
      }
    });
  });

  function showSuccess(message) {
    status.className = "status success";
    status.textContent = message;
    status.style.display = "block";
  }

  function showError(message) {
    status.className = "status error";
    status.textContent = message;
    status.style.display = "block";
  }
</script>

</body>
</html>
