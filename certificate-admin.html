    <div

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    initializeAuth,
    browserLocalPersistence,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  import {
    getFirestore,
    collection,
    getDocs,
    doc,
    setDoc
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


  /* =========================================================
     Firebase
     ========================================================= */

  const firebaseConfig = {

    apiKey: "AIzaSyAB-AIOIQH0tOcVXQnUt7pvVnQi0CoFwSo",

    authDomain:
      "menoufia-dental-congress.firebaseapp.com",

    projectId:
      "menoufia-dental-congress",

    storageBucket:
      "menoufia-dental-congress.firebasestorage.app",

    messagingSenderId:
      "20481129823",

    appId:
      "1:20481129823:web:24658314d19bcacf1dcaea"

  };


  const app = initializeApp(firebaseConfig);

  const auth = initializeAuth(app, {
    persistence: browserLocalPersistence
  });

  const db = getFirestore(app);


  const ORGANIZER_UID =
    "fS56FR5b2vdd632fpUZWXbJFWwj1";


  /* =========================================================
     EmailJS SETTINGS
     
     ضعي بيانات EmailJS الخاصة بك هنا
     ========================================================= */

  const EMAILJS_PUBLIC_KEY =
    "RzOA8l9bSDsKWZXDo";

  const EMAILJS_SERVICE_ID =
    "service_z8xjwj4";

  const EMAILJS_TEMPLATE_ID =
    "template_lvdx61j";


  /* =========================================================
     تهيئة EmailJS
     ========================================================= */

  emailjs.init({
    publicKey: EMAILJS_PUBLIC_KEY
  });


  /* =========================================================
     عناصر الصفحة
     ========================================================= */

  const loading =
    document.getElementById("loading");

  const list =
    document.getElementById("participantsList");

  const statusBox =
    document.getElementById("status");

  const searchInput =
    document.getElementById("searchInput");

  const emailProgressBox =
    document.getElementById("emailProgressBox");

  const emailProgressText =
    document.getElementById("emailProgressText");

  const emailProgressBar =
    document.getElementById("emailProgressBar");

  const emailResult =
    document.getElementById("emailResult");


  let allParticipantsData = [];


  /* =========================================================
     تسجيل الدخول
     ========================================================= */

  onAuthStateChanged(auth, (user) => {

    if (user) {

      if (user.uid === ORGANIZER_UID) {

        loading.innerHTML =
          "تم التحقق. جاري جلب الحاضرين...";

        loadCheckedInParticipants();

      } else {

        loading.innerHTML =
          "خطأ: حساب المنظم غير مطابق (UID: " +
          user.uid +
          ")";

      }

    } else {

      loading.innerHTML =
        "يرجى تسجيل الدخول بحساب المنظم في Firebase أولاً.";

    }

  });


  /* =========================================================
     تنسيق اسم الدكتور
     ========================================================= */

  function formatDoctorName(rawName) {

    const cleanName =
      (rawName || "Participant").trim();

    if (/^dr[\/.\s]/i.test(cleanName)) {

      return cleanName.replace(
        /^dr[\/.\s]+/i,
        "DR/ "
      );

    }

    return "DR/ " + cleanName;

  }


  /* =========================================================
     تحميل الحاضرين والشهادات
     ========================================================= */

  async function loadCheckedInParticipants() {

    try {

      const participantsSnap =
        await getDocs(
          collection(db, "participants")
        );


      const certificatesSnap =
        await getDocs(
          collection(db, "certificates")
        );


      const existingCerts =
        new Map();


      certificatesSnap.forEach(
        (docSnap) => {

          const data =
            docSnap.data();

          if (data.participantId) {

            existingCerts.set(
              data.participantId,
              docSnap.id
            );

          }

        }
      );


      allParticipantsData = [];


      participantsSnap.forEach(
        (participantDoc) => {

          const data =
            participantDoc.data();


          if (data.attendance === true) {

            allParticipantsData.push({

              participantId:
                participantDoc.id,

              data:
                data,

              certId:
                existingCerts.get(
                  participantDoc.id
                )

            });

          }

        }
      );


      loading.style.display = "none";

      renderFilteredList("");


    } catch (error) {

      console.error(error);

      loading.textContent =
        "حدث خطأ أثناء الجلب: " +
        error.message;

    }

  }


  /* =========================================================
     البحث
     ========================================================= */

  function renderFilteredList(query) {

    list.innerHTML = "";

    const lowerQuery =
      query.toLowerCase().trim();


    const filtered =
      allParticipantsData.filter(
        item => {

          const name =
            (item.data.fullName || "")
              .toLowerCase();

          const email =
            (item.data.email || "")
              .toLowerCase();

          return (
            name.includes(lowerQuery) ||
            email.includes(lowerQuery)
          );

        }
      );


    if (filtered.length === 0) {

      list.innerHTML =
        "<p style='text-align:center;color:#777;'>لا توجد نتائج مطابقة للبحث.</p>";

      return;

    }


    filtered.forEach(item => {

      renderRow(
        item.participantId,
        item.data,
        item.certId
      );

    });

  }


  searchInput.addEventListener(
    "input",
    (e) => {

      renderFilteredList(
        e.target.value
      );

    }
  );


  /* =========================================================
     إنشاء صف المشارك
     ========================================================= */

  function renderRow(
    participantId,
    data,
    certId
  ) {

    const row =
      document.createElement("div");

    row.className =
      "participant";


    const info =
      document.createElement("div");

    info.className =
      "participant-info";


    const name =
      document.createElement("div");

    name.className =
      "name";

    name.textContent =
      formatDoctorName(
        data.fullName
      );


    const email =
      document.createElement("div");

    email.className =
      "email";

    email.textContent =
      data.email ||
      "بدون بريد إلكتروني";


    info.appendChild(name);
    info.appendChild(email);


    const actions =
      document.createElement("div");

    actions.className =
      "actions-group";


    if (certId) {

      /* عرض */

      const viewLink =
        document.createElement("a");

      viewLink.className =
        "view-btn";

      viewLink.textContent =
        "عرض الشهادة";

      viewLink.href =
        "certificate.html?id=" +
        encodeURIComponent(certId);

      viewLink.target =
        "_blank";

      actions.appendChild(
        viewLink
      );


      /* تنزيل */

      const downloadSingleBtn =
        document.createElement("button");

      downloadSingleBtn.className =
        "view-btn";

      downloadSingleBtn.style.background =
        "#c9a227";

      downloadSingleBtn.textContent =
        "📥 تنزيل";


      downloadSingleBtn.onclick =
        async () => {

          downloadSingleBtn.disabled =
            true;

          downloadSingleBtn.textContent =
            "جاري الحفظ...";


          try {

            await generateAndDownloadSingle(
              certId,
              formatDoctorName(
                data.fullName
              )
            );

          } catch (error) {

            alert(
              "حدث خطأ: " +
              error.message
            );

          }


          downloadSingleBtn.disabled =
            false;

          downloadSingleBtn.textContent =
            "📥 تنزيل";

        };


      actions.appendChild(
        downloadSingleBtn
      );


      /* إرسال إيميل فردي */

      const emailBtn =
        document.createElement("button");

      emailBtn.className =
        "view-btn btn-email-single";

      emailBtn.textContent =
        "📧 إرسال إيميل";


      emailBtn.onclick =
        async () => {

          if (!data.email) {

            alert(
              "هذا المستخدم ليس لديه بريد إلكتروني مسجل."
            );

            return;

          }


          emailBtn.disabled =
            true;

          emailBtn.textContent =
            "جاري الإرسال...";


          try {

            await sendCertificateEmail({
              email:
                data.email,

              name:
                formatDoctorName(
                  data.fullName
                ),

              certId:
                certId
            });


            alert(
              "تم إرسال الشهادة بنجاح إلى:\n" +
              data.email
            );


          } catch (error) {

            console.error(error);

            alert(
              "فشل إرسال الإيميل:\n" +
              error.message
            );

          }


          emailBtn.disabled =
            false;

          emailBtn.textContent =
            "📧 إرسال إيميل";

        };


      actions.appendChild(
        emailBtn
      );


    } else {

      /* إنشاء الشهادة */

      const createBtn =
        document.createElement("button");

      createBtn.className =
        "view-btn btn-create";

      createBtn.textContent =
        "إنشاء الشهادة";


      createBtn.onclick =
        async () => {

          createBtn.disabled =
            true;

          createBtn.textContent =
            "جاري الإنشاء...";


          try {

            const certificatesSnap =
              await getDocs(
                collection(
                  db,
                  "certificates"
                )
              );


            const nextNum =
              certificatesSnap.size + 1;


            const certificateId =
              "MDC-2026-" +
              String(nextNum)
                .padStart(4, "0");


            const finalName =
              formatDoctorName(
                data.fullName
              );


            await setDoc(
              doc(
                db,
                "certificates",
                certificateId
              ),
              {

                fullName:
                  finalName,

                participantId:
                  participantId,

                email:
                  data.email || "",

                institution:
                  data.institution || "",

                certificateId:
                  certificateId,

                createdAt:
                  new Date().toISOString()

              }
            );


            await loadCheckedInParticipants();


          } catch (err) {

            alert(
              "خطأ: " +
              err.message
            );

            createBtn.disabled =
              false;

            createBtn.textContent =
              "إنشاء الشهادة";

          }

        };


      actions.appendChild(
        createBtn
      );

    }


    row.appendChild(info);

    row.appendChild(actions);

    list.appendChild(row);

  }


  /* =========================================================
     تحميل شهادة واحدة
     ========================================================= */

  async function generateAndDownloadSingle(
    certId,
    fullName
  ) {

    const canvas =
      await renderCertificateCanvas(
        certId,
        fullName
      );


    canvas.toBlob(
      blob => {

        saveAs(
          blob,
          `Certificate-${certId}.png`
        );

      }
    );

  }


  /* =========================================================
     توليد صورة الشهادة
     ========================================================= */

  async function renderCertificateCanvas(
    certId,
    fullName
  ) {

    const renderDiv =
      document.getElementById(
        "renderCert"
      );


    document.getElementById(
      "renderName"
    ).textContent =
      fullName;


    document.getElementById(
      "renderId"
    ).textContent =
      certId;


    const qrDiv =
      document.getElementById(
        "renderQr"
      );


    qrDiv.innerHTML = "";


const verificationUrl =
  "https://maalyzayed.github.io/menoufia-dental-congress/certificate.html?id=" +
  encodeURIComponent(certId);


    new QRCode(
      qrDiv,
      {

        text:
          verificationUrl,

        width:
          150,

        height:
          150,

        correctLevel:
          QRCode.CorrectLevel.H

      }
    );


    await new Promise(
      resolve =>
        setTimeout(resolve, 250)
    );


    return await html2canvas(
      renderDiv,
      {

        scale: 2,

        useCORS: true,

        backgroundColor:
          null

      }
    );

  }


  /* =========================================================
     إرسال شهادة واحدة باستخدام EmailJS
     ========================================================= */

  async function sendCertificateEmail({
    email,
    name,
    certId
  }) {

 const certUrl =
  "https://maalyzayed.github.io/menoufia-dental-congress/certificate.html?id=" +
  encodeURIComponent(certId);


    const templateParams = {

      to_email:
        email,

      to_name:
        name,

      certificate_id:
        certId,

      certificate_url:
        certUrl,

      message:
        `مرحباً ${name},

يسعدنا إرسال شهادة حضورك الخاصة بمؤتمر المنوفية لطب الأسنان.

يمكنك معاينة وتنزيل شهادتك عبر الرابط التالي:

${certUrl}

مع تحيات اللجنة المنظمة.`

    };


    await emailjs.send(

      EMAILJS_SERVICE_ID,

      EMAILJS_TEMPLATE_ID,

      templateParams

    );

  }


  /* =========================================================
     تنزيل جميع الشهادات ZIP
     ========================================================= */

  document
    .getElementById(
      "downloadAllZipBtn"
    )
    .addEventListener(
      "click",
      async () => {

        const btn =
          document.getElementById(
            "downloadAllZipBtn"
          );


        const certificatesSnap =
          await getDocs(
            collection(
              db,
              "certificates"
            )
          );


        if (
          certificatesSnap.empty
        ) {

          alert(
            "لا توجد شهادات مسجلة بعد!"
          );

          return;

        }


        btn.disabled =
          true;

        btn.textContent =
          "⏳ جاري إعداد وضغط الشهادات...";


        try {

          const zip =
            new JSZip();


          let index = 0;


          for (
            const docSnap
            of certificatesSnap.docs
          ) {

            index++;


            btn.textContent =
              `جاري معالجة الشهادة ${index} من ${certificatesSnap.size}...`;


            const certId =
              docSnap.id;


            const fullName =
              docSnap.data().fullName ||
              "Participant";


            const canvas =
              await renderCertificateCanvas(
                certId,
                fullName
              );


            const imgData =
              canvas
                .toDataURL("image/png")
                .replace(
                  /^data:image\/png;base64,/,
                  ""
                );


            zip.file(
              `Certificate-${certId}.png`,
              imgData,
              {
                base64: true
              }
            );

          }


          btn.textContent =
            "📦 جاري ضغط الملفات وتنزيل الـ ZIP...";


          const content =
            await zip.generateAsync({
              type: "blob"
            });


          saveAs(
            content,
            "Menoufia-Dental-Congress-Certificates.zip"
          );


          btn.disabled =
            false;

          btn.textContent =
            "📦 تنزيل كل الشهادات كملف مضغوط (ZIP)";


          alert(
            "تم تنزيل ملف الـ ZIP بنجاح!"
          );


        } catch (error) {

          console.error(error);


          alert(
            "حدث خطأ أثناء إنشاء ملف الـ ZIP: " +
            error.message
          );


          btn.disabled =
            false;

          btn.textContent =
            "📦 تنزيل كل الشهادات كملف مضغوط (ZIP)";

        }

      }
    );


  /* =========================================================
     إرسال جميع الشهادات
     
     مهم:
     لا window.open
     لا Gmail tabs
     الإرسال يتم تلقائياً
     ========================================================= */

  document
    .getElementById(
      "sendAllEmailBtn"
    )
    .addEventListener(
      "click",
      async () => {

        const btn =
          document.getElementById(
            "sendAllEmailBtn"
          );


        /* التأكد من إعداد EmailJS */

        if (
          EMAILJS_PUBLIC_KEY ===
            "YOUR_EMAILJS_PUBLIC_KEY" ||
          EMAILJS_SERVICE_ID ===
            "YOUR_EMAILJS_SERVICE_ID" ||
          EMAILJS_TEMPLATE_ID ===
            "YOUR_EMAILJS_TEMPLATE_ID"
        ) {

          alert(
            "لم يتم إعداد EmailJS بعد.\n\n" +
            "ضعي Public Key و Service ID و Template ID داخل الكود أولاً."
          );

          return;

        }


        const certificatesSnap =
          await getDocs(
            collection(
              db,
              "certificates"
            )
          );


        if (
          certificatesSnap.empty
        ) {

          alert(
            "لا توجد شهادات مسجلة بعد!"
          );

          return;

        }


        const certificates =
          certificatesSnap.docs
            .map(
              docSnap => ({

                id:
                  docSnap.id,

                data:
                  docSnap.data()

              })
            )
            .filter(
              item =>
                item.data.email &&
                item.data.email.trim() !== ""
            );


        if (
          certificates.length === 0
        ) {

          alert(
            "لا توجد شهادات تحتوي على بريد إلكتروني."
          );

          return;

        }


        const confirmed =
          confirm(
            `سيتم إرسال الشهادات تلقائياً إلى ${certificates.length} مشارك.\n\n` +
            "لن يتم فتح أي تبويب Gmail.\n\n" +
            "هل تريدين بدء الإرسال؟"
          );


        if (!confirmed) {

          return;

        }


        /* تعطيل الزر */

        btn.disabled =
          true;

        btn.textContent =
          "⏳ جاري إرسال الشهادات...";


        /* إظهار التقدم */

        emailProgressBox.style.display =
          "block";


        emailProgressBar.style.width =
          "0%";


        emailProgressText.textContent =
          `جاري الإرسال: 0 من ${certificates.length}`;


        emailResult.innerHTML =
          "";


        let successCount = 0;

        let failedCount = 0;

        const failedEmails = [];


        try {

          for (
            let i = 0;
            i < certificates.length;
            i++
          ) {

            const item =
              certificates[i];


            const data =
              item.data;


            const certId =
              item.id;


            emailProgressText.textContent =
              `جاري إرسال الشهادة ${i + 1} من ${certificates.length}...`;


            try {

              await sendCertificateEmail({

                email:
                  data.email,

                name:
                  formatDoctorName(
                    data.fullName
                  ),

                certId:
                  certId

              });


              successCount++;


            } catch (error) {

              console.error(
                "فشل إرسال:",
                data.email,
                error
              );


              failedCount++;


              failedEmails.push(
                data.email
              );

            }


            const progress =
              ((i + 1) /
                certificates.length) *
              100;


            emailProgressBar.style.width =
              progress + "%";


            emailProgressText.textContent =
              `تمت معالجة ${i + 1} من ${certificates.length}`;


            /*
             * ننتظر قليلاً بين الرسائل
             * لتجنب تجاوز حدود خدمة الإرسال
             */

            if (
              i <
              certificates.length - 1
            ) {

              await sleep(700);

            }

          }


          /* النتيجة */

          emailProgressText.textContent =
            "✅ انتهى إرسال الشهادات";


          emailProgressBar.style.width =
            "100%";


          emailResult.innerHTML =
            `
              <strong>تم الانتهاء من الإرسال.</strong><br>
              ✅ تم الإرسال بنجاح: ${successCount}<br>
              ❌ فشل الإرسال: ${failedCount}
            `;


          if (
            failedEmails.length > 0
          ) {

            emailResult.innerHTML +=
              `
                <br>
                <small>
                  الإيميلات التي فشل إرسالها:
                  <br>
                  ${failedEmails.join("<br>")}
                </small>
              `;

          }


          statusBox.className =
            "status success";


          statusBox.textContent =
            `تم إرسال ${successCount} شهادة بنجاح من أصل ${certificates.length}.`;


          statusBox.style.display =
            "block";


        } catch (error) {

          console.error(error);


          emailProgressText.textContent =
            "❌ حدث خطأ أثناء الإرسال";


          emailResult.innerHTML =
            "حدث خطأ: " +
            error.message;


          statusBox.className =
            "status error";


          statusBox.textContent =
            "حدث خطأ أثناء إرسال الشهادات: " +
            error.message;


          statusBox.style.display =
            "block";

        }


        btn.disabled =
          false;


        btn.textContent =
          "📧 إرسال عبر الإيميل للجميع";

      }
    );


  /* =========================================================
     دالة انتظار
     ========================================================= */

  function sleep(ms) {

    return new Promise(
      resolve =>
        setTimeout(resolve, ms)
    );

  }


  /* =========================================================
     إنشاء جميع الشهادات المفقودة
     ========================================================= */

  document
    .getElementById(
      "generateAllBtn"
    )
    .addEventListener(
      "click",
      async () => {

        const btn =
          document.getElementById(
            "generateAllBtn"
          );


        btn.disabled =
          true;


        btn.textContent =
          "جاري الفحص وإنشاء الشهادات...";


        try {

          const participantsSnap =
            await getDocs(
              collection(
                db,
                "participants"
              )
            );


          const certificatesSnap =
            await getDocs(
              collection(
                db,
                "certificates"
              )
            );


          const existingCerts =
            new Map();


          certificatesSnap.forEach(
            docSnap => {

              const d =
                docSnap.data();


              if (
                d.participantId
              ) {

                existingCerts.set(
                  d.participantId,
                  docSnap.id
                );

              }

            }
          );


          let totalCertsCount =
            certificatesSnap.size;


          let createdCount =
            0;


          for (
            const participantDoc
            of participantsSnap.docs
          ) {

            const data =
              participantDoc.data();


            const participantId =
              participantDoc.id;


            if (
              data.attendance === true &&
              !existingCerts.has(
                participantId
              )
            ) {

              totalCertsCount++;


              const certificateId =
                "MDC-2026-" +
                String(
                  totalCertsCount
                ).padStart(
                  4,
                  "0"
                );


              const finalName =
                formatDoctorName(
                  data.fullName
                );


              await setDoc(
                doc(
                  db,
                  "certificates",
                  certificateId
                ),
                {

                  fullName:
                    finalName,

                  participantId:
                    participantId,

                  email:
                    data.email || "",

                  institution:
                    data.institution || "",

                  certificateId:
                    certificateId,

                  createdAt:
                    new Date().toISOString()

                }
              );


              existingCerts.set(
                participantId,
                certificateId
              );


              createdCount++;

            }

          }


          statusBox.className =
            "status success";


          statusBox.textContent =
            `تم بنجاح إنشاء ${createdCount} شهادة جديدة.`;


          statusBox.style.display =
            "block";


          setTimeout(
            () => {

              loadCheckedInParticipants();


              btn.disabled =
                false;


              btn.textContent =
                "🚀 فحص الحاضرين وإنشاء الشهادات المفقودة دفعة واحدة";

            },
            1500
          );


        } catch (error) {

          console.error(error);


          statusBox.className =
            "status error";


          statusBox.textContent =
            "حدث خطأ: " +
            error.message;


          statusBox.style.display =
            "block";


          btn.disabled =
            false;


          btn.textContent =
            "🚀 فحص الحاضرين وإنشاء الشهادات المفقودة دفعة واحدة";

        }

      }
    );

</script>
