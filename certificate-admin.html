    .btn-email-single {

    .loading {

        text-align: center;

      .top-actions {

      }
    }
  </style>
</head>

  <script type="module">

    /*
    =========================================================
    Firebase
    =========================================================
    */

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
      initializeAuth,
      browserLocalPersistence,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      setDoc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    /*
    =========================================================
    Firebase Functions
    =========================================================
    */

    import {
      getFunctions,
      httpsCallable
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-functions.js";


    /*
    =========================================================
    Firebase Configuration
    =========================================================
    */

    const firebaseConfig = {

      apiKey:
        "AIzaSyAB-AIOIQH0tOcVXQnUt7pvVnQi0CoFwSo",

      authDomain:
        "menoufia-dental-congress.firebaseapp.com",

      projectId:
        "menoufia-dental-congress",

      storageBucket:
        "menoufia-dental-congress.firebasestorage.app",

      messagingSenderId:
        "20481129823",

      appId:
        "1:20481129823:web:24658314d19bcacf1dcaea"

    };


    /*
    =========================================================
    Initialize Firebase
    =========================================================
    */

    const app = initializeApp(firebaseConfig);

    const auth = initializeAuth(app, {
      persistence: browserLocalPersistence
    });

    const db = getFirestore(app);


    /*
    =========================================================
    Firebase Functions
    =========================================================

    لازم الـ Cloud Function تكون منشورة في نفس المنطقة.
    */

    const functions = getFunctions(app, "europe-west1");

    const sendCertificateEmail =
      httpsCallable(functions, "sendCertificateEmail");


    /*
    =========================================================
    Organizer UID
    =========================================================
    */

    const ORGANIZER_UID =
      "fS56FR5b2vdd632fpUZWXbJFWwj1";


    /*
    =========================================================
    Elements
    =========================================================
    */

    const loading =
      document.getElementById("loading");

    const list =
      document.getElementById("participantsList");

    const statusBox =
      document.getElementById("status");

    const searchInput =
      document.getElementById("searchInput");


    let allParticipantsData = [];


    /*
    =========================================================
    Authentication
    =========================================================
    */

    onAuthStateChanged(auth, (user) => {

      if (user) {

        if (user.uid === ORGANIZER_UID) {

          loading.innerHTML =
            "تم التحقق. جاري جلب الحاضرين...";

          loadCheckedInParticipants();

        } else {

          loading.innerHTML =
            "خطأ: حساب المنظم غير مطابق (UID: " +
            user.uid +
            ")";

        }

      } else {

        loading.innerHTML =
          "يرجى تسجيل الدخول بحساب المنظم في Firebase أولاً.";

      }

    });


    /*
    =========================================================
    Format Doctor Name
    =========================================================
    */

    function formatDoctorName(rawName) {

      const cleanName =
        (rawName || "Participant").trim();


      if (/^dr[\/.\s]/i.test(cleanName)) {

        return cleanName.replace(
          /^dr[\/.\s]+/i,
          "DR/ "
        );

      }


      return "DR/ " + cleanName;

    }


    /*
    =========================================================
    Load Participants
    =========================================================
    */

    async function loadCheckedInParticipants() {

      try {

        const participantsSnap =
          await getDocs(
            collection(db, "participants")
          );


        const certificatesSnap =
          await getDocs(
            collection(db, "certificates")
          );


        const existingCerts =
          new Map();


        certificatesSnap.forEach((docSnap) => {

          const data =
            docSnap.data();


          if (data.participantId) {

            existingCerts.set(
              data.participantId,
              docSnap.id
            );

          }

        });


        allParticipantsData = [];


        participantsSnap.forEach((participantDoc) => {

          const data =
            participantDoc.data();


          if (data.attendance === true) {

            allParticipantsData.push({

              participantId:
                participantDoc.id,

              data:
                data,

              certId:
                existingCerts.get(
                  participantDoc.id
                )

            });

          }

        });


        loading.style.display = "none";

        renderFilteredList("");


      } catch (error) {

        console.error(error);

        loading.textContent =
          "حدث خطأ أثناء الجلب: " +
          error.message;

      }

    }


    /*
    =========================================================
    Search
    =========================================================
    */

    function renderFilteredList(query) {

      list.innerHTML = "";


      const lowerQuery =
        query.toLowerCase().trim();


      const filtered =
        allParticipantsData.filter((item) => {

          const name =
            (item.data.fullName || "")
              .toLowerCase();


          const email =
            (item.data.email || "")
              .toLowerCase();


          return (
            name.includes(lowerQuery) ||
            email.includes(lowerQuery)
          );

        });


      if (filtered.length === 0) {

        list.innerHTML =
          "<p style='text-align:center;color:#777;'>لا توجد نتائج مطابقة للبحث.</p>";

        return;

      }


      filtered.forEach((item) => {

        renderRow(
          item.participantId,
          item.data,
          item.certId
        );

      });

    }


    searchInput.addEventListener(
      "input",
      (e) => {

        renderFilteredList(
          e.target.value
        );

      }
    );


    /*
    =========================================================
    Render Participant Row
    =========================================================
    */

    function renderRow(
      participantId,
      data,
      certId
    ) {

      const row =
        document.createElement("div");

      row.className =
        "participant";


      /*
      Info
      */

      const info =
        document.createElement("div");

      info.className =
        "participant-info";


      const name =
        document.createElement("div");

      name.className =
        "name";

      name.textContent =
        formatDoctorName(
          data.fullName
        );


      const email =
        document.createElement("div");

      email.className =
        "email";

      email.textContent =
        data.email ||
        "بدون بريد إلكتروني";


      info.appendChild(name);

      info.appendChild(email);


      /*
      Actions
      */

      const actions =
        document.createElement("div");

      actions.className =
        "actions-group";


      /*
      =======================================================
      Certificate Exists
      =======================================================
      */

      if (certId) {


        /*
        عرض الشهادة
        */

        const viewLink =
          document.createElement("a");

        viewLink.className =
          "view-btn";

        viewLink.textContent =
          "عرض الشهادة";

        viewLink.href =
          "certificate.html?id=" +
          encodeURIComponent(certId);

        viewLink.target =
          "_blank";

        actions.appendChild(
          viewLink
        );


        /*
        تنزيل PNG
        */

        const downloadSingleBtn =
          document.createElement("button");

        downloadSingleBtn.className =
          "view-btn";

        downloadSingleBtn.style.background =
          "#c9a227";

        downloadSingleBtn.textContent =
          "📥 تنزيل";

        downloadSingleBtn.onclick =
          async () => {

            downloadSingleBtn.disabled =
              true;

            downloadSingleBtn.textContent =
              "جاري الحفظ...";


            try {

              await generateAndDownloadSingle(
                certId,
                formatDoctorName(
                  data.fullName
                )
              );

            } catch (error) {

              alert(
                "حدث خطأ أثناء تنزيل الشهادة: " +
                error.message
              );

            }


            downloadSingleBtn.disabled =
              false;

            downloadSingleBtn.textContent =
              "📥 تنزيل";

          };


        actions.appendChild(
          downloadSingleBtn
        );


        /*
        =====================================================
        إرسال PDF بالإيميل
        =====================================================
        */

        const emailBtn =
          document.createElement("button");

        emailBtn.className =
          "view-btn btn-email-single";

        emailBtn.textContent =
          "📧 إرسال PDF";


        emailBtn.onclick =
          async () => {

            if (!data.email) {

              alert(
                "هذا المستخدم ليس لديه بريد إلكتروني مسجل."
              );

              return;

            }


            emailBtn.disabled =
              true;

            emailBtn.textContent =
              "⏳ جاري إنشاء PDF...";


            try {

              await sendCertificatePdfByEmail(

                certId,

                formatDoctorName(
                  data.fullName
                ),

                data.email

              );


              /*
              تسجيل حالة الإرسال في Firestore
              */

              try {

                await updateDoc(
                  doc(
                    db,
                    "certificates",
                    certId
                  ),
                  {
                    emailSentAt:
                      new Date().toISOString(),

                    emailSentTo:
                      data.email
                  }
                );

              } catch (updateError) {

                console.warn(
                  "تعذر تسجيل حالة الإرسال:",
                  updateError
                );

              }


              emailBtn.classList.add(
                "sent"
              );

              emailBtn.textContent =
                "✅ تم الإرسال";


              alert(
                "تم إرسال شهادة PDF بنجاح إلى:\n" +
                data.email
              );


            } catch (error) {

              console.error(error);

              alert(
                "فشل إرسال الشهادة:\n" +
                error.message
              );


              emailBtn.disabled =
                false;

              emailBtn.textContent =
                "📧 إرسال PDF";

            }

          };


        actions.appendChild(
          emailBtn
        );


        /*
        حالة الإيميل السابقة
        */

        if (data.emailSentAt) {

          const emailStatus =
            document.createElement("div");

          emailStatus.className =
            "email-status";

          emailStatus.textContent =
            "✓ تم إرسال البريد سابقًا";

          info.appendChild(
            emailStatus
          );

        }


      } else {


        /*
        =====================================================
        إنشاء الشهادة
        =====================================================
        */

        const createBtn =
          document.createElement("button");

        createBtn.className =
          "view-btn btn-create";

        createBtn.textContent =
          "إنشاء الشهادة";


        createBtn.onclick =
          async () => {

            createBtn.disabled =
              true;

            createBtn.textContent =
              "جاري الإنشاء...";


            try {

              const certificatesSnap =
                await getDocs(
                  collection(
                    db,
                    "certificates"
                  )
                );


              const nextNum =
                certificatesSnap.size + 1;


              const certificateId =
                "MDC-2026-" +
                String(nextNum).padStart(
                  4,
                  "0"
                );


              const finalName =
                formatDoctorName(
                  data.fullName
                );


              await setDoc(
                doc(
                  db,
                  "certificates",
                  certificateId
                ),
                {

                  fullName:
                    finalName,

                  participantId:
                    participantId,

                  email:
                    data.email || "",

                  institution:
                    data.institution || "",

                  certificateId:
                    certificateId,

                  createdAt:
                    new Date().toISOString()

                }
              );


              await loadCheckedInParticipants();


            } catch (err) {

              alert(
                "خطأ: " +
                err.message
              );


              createBtn.disabled =
                false;

              createBtn.textContent =
                "إنشاء الشهادة";

            }

          };


        actions.appendChild(
          createBtn
        );

      }


      row.appendChild(info);

      row.appendChild(actions);

      list.appendChild(row);

    }


    /*
    =========================================================
    Generate PNG
    =========================================================
    */

    async function generateAndDownloadSingle(
      certId,
      fullName
    ) {

      const canvas =
        await renderCertificateCanvas(
          certId,
          fullName
        );


      canvas.toBlob(
        (blob) => {

          if (!blob) {

            throw new Error(
              "تعذر إنشاء صورة الشهادة."
            );

          }


          saveAs(
            blob,
            `Certificate-${certId}.png`
          );

        },
        "image/png"
      );

    }


    /*
    =========================================================
    Render Certificate
    =========================================================
    */

    async function renderCertificateCanvas(
      certId,
      fullName
    ) {

      const renderDiv =
        document.getElementById(
          "renderCert"
        );


      document.getElementById(
        "renderName"
      ).textContent =
        fullName;


      document.getElementById(
        "renderId"
      ).textContent =
        certId;


      /*
      QR
      */

      const qrDiv =
        document.getElementById(
          "renderQr"
        );


      qrDiv.innerHTML = "";


      /*
      رابط التحقق الصحيح حتى لو الموقع
      موجود داخل GitHub Pages subfolder
      */

      const verificationUrl =
        new URL(
          "certificate.html?id=" +
          encodeURIComponent(certId),
          window.location.href
        ).href;


      new QRCode(
        qrDiv,
        {
          text:
            verificationUrl,

          width:
            150,

          height:
            150,

          correctLevel:
            QRCode.CorrectLevel.H
        }
      );


      /*
      انتظار رسم QR
      */

      await new Promise(
        (resolve) =>
          setTimeout(resolve, 300)
      );


      /*
      إنشاء Canvas بجودة عالية
      */

      return await html2canvas(
        renderDiv,
        {
          scale: 3,

          useCORS: true,

          allowTaint: false,

          backgroundColor:
            null,

          logging:
            false
        }
      );

    }


    /*
    =========================================================
    إنشاء PDF Base64
    =========================================================
    */

    async function createCertificatePdfBase64(
      certId,
      fullName
    ) {

      const canvas =
        await renderCertificateCanvas(
          certId,
          fullName
        );


      const {
        jsPDF
      } = window.jspdf;


      /*
      نفس نسبة الشهادة الأصلية:
      1448 × 1086
      */

      const pdfWidth =
        297;


      const pdfHeight =
        pdfWidth *
        (1086 / 1448);


      const pdf =
        new jsPDF(
          {
            orientation:
              "landscape",

            unit:
              "mm",

            format:
              [
                pdfWidth,
                pdfHeight
              ],

            compress:
              false
          }
        );


      const imgData =
        canvas.toDataURL(
          "image/png"
        );


      pdf.addImage(
        imgData,
        "PNG",
        0,
        0,
        pdfWidth,
        pdfHeight,
        undefined,
        "NONE"
      );


      /*
      استخراج Base64 فقط
      */

      const pdfDataUri =
        pdf.output(
          "datauristring"
        );


      const pdfBase64 =
        pdfDataUri.split(",")[1];


      return pdfBase64;

    }


    /*
    =========================================================
    إرسال PDF إلى Firebase Function
    =========================================================
    */

    async function sendCertificatePdfByEmail(
      certId,
      fullName,
      email
    ) {

      if (!email) {

        throw new Error(
          "لا يوجد بريد إلكتروني للمشارك."
        );

      }


      /*
      إنشاء PDF
      */

      const pdfBase64 =
        await createCertificatePdfBase64(
          certId,
          fullName
        );


      /*
      حماية من إرسال ملف ضخم جدًا
      */

      if (
        !pdfBase64 ||
        pdfBase64.length >
        15000000
      ) {

        throw new Error(
          "حجم ملف PDF كبير جدًا."
        );

      }


      /*
      استدعاء Cloud Function
      */

      const result =
        await sendCertificateEmail(
          {
            to:
              email,

            fullName:
              fullName,

            certId:
              certId,

            pdfBase64:
              pdfBase64
          }
        );


      return result.data;

    }


    /*
    =========================================================
    تنزيل كل الشهادات ZIP
    =========================================================
    */

    document
      .getElementById(
        "downloadAllZipBtn"
      )
      .addEventListener(
        "click",
        async () => {

          const btn =
            document.getElementById(
              "downloadAllZipBtn"
            );


          try {

            const certificatesSnap =
              await getDocs(
                collection(
                  db,
                  "certificates"
                )
              );


            if (
              certificatesSnap.empty
            ) {

              alert(
                "لا توجد شهادات مسجلة بعد!"
              );

              return;

            }


            btn.disabled =
              true;


            btn.textContent =
              "⏳ جاري إعداد الشهادات...";


            const zip =
              new JSZip();


            let index =
              0;


            for (
              const docSnap
              of certificatesSnap.docs
            ) {

              index++;


              btn.textContent =
                `جاري معالجة الشهادة ${index} من ${certificatesSnap.size}...`;


              const certId =
                docSnap.id;


              const fullName =
                docSnap.data().fullName ||
                "Participant";


              const canvas =
                await renderCertificateCanvas(
                  certId,
                  fullName
                );


              const imgData =
                canvas
                  .toDataURL(
                    "image/png"
                  )
                  .replace(
                    /^data:image\/png;base64,/,
                    ""
                  );


              zip.file(
                `Certificate-${certId}.png`,
                imgData,
                {
                  base64:
                    true
                }
              );

            }


            btn.textContent =
              "📦 جاري ضغط الملفات...";


            const content =
              await zip.generateAsync(
                {
                  type:
                    "blob"
                }
              );


            saveAs(
              content,
              "Menoufia-Dental-Congress-Certificates.zip"
            );


            alert(
              "تم تنزيل ملف ZIP بنجاح!"
            );


          } catch (error) {

            console.error(error);

            alert(
              "حدث خطأ أثناء إنشاء ZIP:\n" +
              error.message
            );

          } finally {

            btn.disabled =
              false;

            btn.textContent =
              "📦 تنزيل كل الشهادات كملف مضغوط (ZIP)";

          }

        }
      );


    /*
    =========================================================
    إرسال جميع الشهادات PDF بالإيميل
    =========================================================
    */

    document
      .getElementById(
        "sendAllEmailBtn"
      )
      .addEventListener(
        "click",
        async () => {

          const btn =
            document.getElementById(
              "sendAllEmailBtn"
            );


          const confirmed =
            confirm(
              "هل تريد إرسال شهادات PDF كمرفقات إلى جميع المشاركين الذين لديهم بريد إلكتروني؟\n\nقد تستغرق العملية بعض الوقت."
            );


          if (!confirmed) {

            return;

          }


          btn.disabled =
            true;


          btn.textContent =
            "⏳ جاري تجهيز الشهادات...";


          try {

            const certificatesSnap =
              await getDocs(
                collection(
                  db,
                  "certificates"
                )
              );


            if (
              certificatesSnap.empty
            ) {

              alert(
                "لا توجد شهادات مسجلة."
              );

              return;

            }


            let sentCount =
              0;


            let failedCount =
              0;


            let skippedCount =
              0;


            const total =
              certificatesSnap.size;


            let current =
              0;


            for (
              const docSnap
              of certificatesSnap.docs
            ) {

              current++;


              const data =
                docSnap.data();


              const certId =
                docSnap.id;


              const fullName =
                data.fullName ||
                "Participant";


              const email =
                data.email ||
                "";


              /*
              لا يوجد بريد
              */

              if (!email) {

                skippedCount++;

                continue;

              }


              btn.textContent =
                `📧 إرسال ${current} من ${total}...`;


              try {

                await sendCertificatePdfByEmail(
                  certId,
                  fullName,
                  email
                );


                /*
                تسجيل الإرسال
                */

                try {

                  await updateDoc(
                    doc(
                      db,
                      "certificates",
                      certId
                    ),
                    {

                      emailSentAt:
                        new Date().toISOString(),

                      emailSentTo:
                        email

                    }
                  );

                } catch (updateError) {

                  console.warn(
                    "تعذر تحديث حالة الإرسال:",
                    updateError
                  );

                }


                sentCount++;


              } catch (error) {

                failedCount++;

                console.error(
                  "فشل إرسال " +
                  certId,
                  error
                );

              }


              /*
              تأخير بسيط بين الرسائل
              */

              await new Promise(
                (resolve) =>
                  setTimeout(
                    resolve,
                    700
                  )
              );

            }


            alert(
              "انتهى إرسال الشهادات.\n\n" +
              "تم الإرسال: " +
              sentCount +
              "\n" +
              "فشل الإرسال: " +
              failedCount +
              "\n" +
              "بدون بريد: " +
              skippedCount
            );


            await loadCheckedInParticipants();


          } catch (error) {

            console.error(error);

            alert(
              "حدث خطأ أثناء الإرسال الجماعي:\n" +
              error.message
            );

          } finally {

            btn.disabled =
              false;

            btn.textContent =
              "📧 إرسال الشهادات PDF بالإيميل للجميع";

          }

        }
      );


    /*
    =========================================================
    إنشاء كل الشهادات المفقودة
    =========================================================
    */

    document
      .getElementById(
        "generateAllBtn"
      )
      .addEventListener(
        "click",
        async () => {

          const btn =
            document.getElementById(
              "generateAllBtn"
            );


          btn.disabled =
            true;


          btn.textContent =
            "جاري الفحص وإنشاء الشهادات...";


          try {

            const participantsSnap =
              await getDocs(
                collection(
                  db,
                  "participants"
                )
              );


            const certificatesSnap =
              await getDocs(
                collection(
                  db,
                  "certificates"
                )
              );


            /*
            الشهادات الموجودة
            */

            const existingCerts =
              new Map();


            certificatesSnap.forEach(
              (docSnap) => {

                const d =
                  docSnap.data();


                if (
                  d.participantId
                ) {

                  existingCerts.set(
                    d.participantId,
                    docSnap.id
                  );

                }

              }
            );


            let totalCertsCount =
              certificatesSnap.size;


            let createdCount =
              0;


            /*
            المرور على الحاضرين
            */

            for (
              const participantDoc
              of participantsSnap.docs
            ) {

              const data =
                participantDoc.data();


              const participantId =
                participantDoc.id;


              /*
              حاضر وليس لديه شهادة
              */

              if (
                data.attendance === true &&
                !existingCerts.has(
                  participantId
                )
              ) {

                totalCertsCount++;


                const certificateId =
                  "MDC-2026-" +
                  String(
                    totalCertsCount
                  ).padStart(
                    4,
                    "0"
                  );


                const finalName =
                  formatDoctorName(
                    data.fullName
                  );


                await setDoc(
                  doc(
                    db,
                    "certificates",
                    certificateId
                  ),
                  {

                    fullName:
                      finalName,

                    participantId:
                      participantId,

                    email:
                      data.email || "",

                    institution:
                      data.institution || "",

                    certificateId:
                      certificateId,

                    createdAt:
                      new Date().toISOString()

                  }
                );


                existingCerts.set(
                  participantId,
                  certificateId
                );


                createdCount++;

              }

            }


            statusBox.className =
              "status success";


            statusBox.textContent =
              `تم بنجاح إنشاء ${createdCount} شهادة جديدة.`;


            statusBox.style.display =
              "block";


            await loadCheckedInParticipants();


          } catch (error) {

            console.error(error);


            statusBox.className =
              "status error";


            statusBox.textContent =
              "حدث خطأ: " +
              error.message;


            statusBox.style.display =
              "block";

          } finally {

            btn.disabled =
              false;


            btn.textContent =
              "🚀 فحص الحاضرين وإنشاء الشهادات المفقودة دفعة واحدة";

          }

        }
      );

  </script>
