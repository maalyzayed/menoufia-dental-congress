<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>معاينة الشهادة | مؤتمر المنوفية لطب الأسنان</title>

  <!-- خط الاسم -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">

  <!-- jsPDF لإنشاء PDF بجودة فائقة مباشرة -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- QR Code -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .certificate-wrapper {
      position: relative;
      width: 100%;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      overflow: hidden;
      margin-bottom: 20px;
      display: none;
      container-type: inline-size;
    }

    #renderCert {
      position: relative !important;
      width: 100%;
      aspect-ratio: 1448 / 1086;
      background-image: url('certificate-template.jpg?v=6');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
    }

    .cert-name-container {
      position: absolute !important;
      left: 25.5%;
      top: 38.5%;
      width: 52%;
      height: 10%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 5;
    }

    .cert-name {
      color: #102c52;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 700;
      font-size: 2.2cqw;
      white-space: nowrap;
      line-height: 1;
      max-width: 100%;
    }

    .cert-qr-container {
      position: absolute !important;
      left: 4.3%;
      top: 74.2%;
      width: 8%;
      height: 10.5%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      overflow: hidden;
    }

    .cert-qr-container img,
    .cert-qr-container canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .cert-id-container {
      position: absolute !important;
      left: 4.3%;
      top: 87%;
      width: 8%;
      height: 3.5%;
      background: #173b63;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      overflow: hidden;
    }

    .cert-id-text {
      color: white;
      font-size: 0.85cqw;
      font-weight: bold;
      font-family: Arial, sans-serif;
      white-space: nowrap;
      line-height: 1;
    }

    .download-btn {
      background: #c9a227;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(201, 162, 39, 0.3);
      display: none;
      margin-top: 15px;
    }

    .download-btn:hover {
      background: #b08d1f;
    }

    .download-btn:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .status-box {
      font-size: 18px;
      color: #d9534f;
      background: #fdf7f7;
      border: 1px solid #ebccd1;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .download-btn { width: 100%; font-size: 15px; padding: 13px 15px; }
    }
  </style>
</head>

<body>

<div class="container">
  <div id="statusBox" class="status-box">جاري الاتصال بقاعدة البيانات وتحميل الشهادة...</div>

  <div class="certificate-wrapper" id="certWrapper">
    <div id="renderCert">
      <div class="cert-name-container">
        <div id="renderName" class="cert-name"></div>
      </div>
      <div class="cert-qr-container" id="renderQr"></div>
      <div class="cert-id-container">
        <div id="renderId" class="cert-id-text"></div>
      </div>
    </div>
  </div>

  <button id="downloadBtn" class="download-btn">📄 تنزيل الشهادة PDF بجودة فائقة</button>
</div>

<!-- عنصر مخفي لتوليد الـ QR بدقة عالية لتضمينه في الـ PDF -->
<div id="hiddenQrContainer" style="display:none;"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAB-AIOIQH0tOcVXQnUt7pvVnQi0CoFwSo",
    authDomain: "menoufia-dental-congress.firebaseapp.com",
    projectId: "menoufia-dental-congress",
    storageBucket: "menoufia-dental-congress.firebasestorage.app",
    messagingSenderId: "20481129823",
    appId: "1:20481129823:web:24658314d19bcacf1dcaea"
  };

  const statusBox = document.getElementById("statusBox");
  const certWrapper = document.getElementById("certWrapper");
  const downloadBtn = document.getElementById("downloadBtn");

  let participantName = "";
  let certificateId = "";

  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const certId = urlParams.get("id");

    if (!certId) {
      statusBox.textContent = "خطأ: لم يتم كتابة رقم الشهادة في الرابط (مثلاً: ?id=رقم_الشهادة)";
      throw new Error("No ID provided");
    }

    certificateId = certId;
    statusBox.textContent = `جاري البحث عن الشهادة برقم: ${certId} ...`;

    const docRef = doc(db, "certificates", certId);
    const docSnap = await getDoc(docRef);

    if (!docSnap.exists()) {
      statusBox.textContent = `خطأ: رقم الشهادة (${certId}) غير موجود داخل قاعدة بيانات Firebase.`;
      throw new Error("Document not found");
    }

    const data = docSnap.data();
    const rawName = data.fullName || data.name || data.ParticipantName || "مشارك بدون اسم";
    participantName = rawName.startsWith("DR/ ") || rawName.startsWith("Dr/ ") ? rawName : `DR/ ${rawName}`;

    document.getElementById("renderName").textContent = participantName;
    document.getElementById("renderId").textContent = certId;

    const qrDiv = document.getElementById("renderQr");
    qrDiv.innerHTML = "";

    new QRCode(qrDiv, {
      text: window.location.href,
      width: 300,
      height: 300,
      correctLevel: QRCode.CorrectLevel.H
    });

    statusBox.style.display = "none";
    certWrapper.style.display = "block";
    downloadBtn.style.display = "inline-block";

  } catch (err) {
    console.error("خطأ:", err);
    if (!statusBox.textContent.includes("خطأ:")) {
      statusBox.textContent = "حدث خطأ برمجي أثناء الاتصال: " + err.message;
    }
  }

  // توليد PDF مباشرة باستخدام jsPDF بدون html2canvas لضمان أقصى درجة وضوح ونقاء
  downloadBtn.addEventListener("click", async () => {
    downloadBtn.disabled = true;
    downloadBtn.textContent = "جاري تجهيز ملف PDF بجودة فائقة...";

    try {
      const { jsPDF } = window.jspdf;

      // مقاس الشهادة بالعرض والارتفاع بالملم (نسبة 4:3)
      const pdfWidth = 297;
      const pdfHeight = 222.75; // 297 * (1086 / 1448)

      const pdf = new jsPDF({
        orientation: "landscape",
        unit: "mm",
        format: [pdfWidth, pdfHeight],
        compress: false
      });

      // 1. تحميل صورة الخلفية وتحويلها إلى Base64 بدقتها الأصلية الكاملة
      const imgUrl = 'certificate-template.jpg?v=6';
      const imgBase64 = await new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 1448;
          canvas.height = 1086;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 1448, 1086);
          resolve(canvas.toDataURL('image/jpeg', 1.0));
        };
        img.onerror = reject;
        img.src = imgUrl;
      });

      // رسم الخلفية بدقة كاملة تملأ الصفحة
      pdf.addImage(imgBase64, 'JPEG', 0, 0, pdfWidth, pdfHeight, undefined, 'FAST');

      // 2. توليد QR Code بدقة عالية جداً كصورة مؤقتة لاستخدامها في الـ PDF
      const tempQrDiv = document.createElement('div');
      new QRCode(tempQrDiv, {
        text: window.location.href,
        width: 600,
        height: 600,
        correctLevel: QRCode.CorrectLevel.H
      });
      
      const qrCanvas = tempQrDiv.querySelector('canvas') || tempQrDiv.querySelector('img');
      let qrDataUrl = '';
      if (qrCanvas.tagName === 'CANVAS') {
        qrDataUrl = qrCanvas.toDataURL('image/png');
      } else {
        qrDataUrl = qrCanvas.src;
      }

      // إحداثيات QR Code بناءً على نسب التصميم الأصلي (left: 4.3%, top: 74.2%, width: 8%, height: 10.5%)
      const qrX = pdfWidth * 0.043;
      const qrY = pdfHeight * 0.742;
      const qrW = pdfWidth * 0.08;
      const qrH = pdfHeight * 0.105;

      // رسم خلفية بيضاء تحت الـ QR لتجنب الشفافية
      pdf.setFillColor(255, 255, 255);
      pdf.rect(qrX, qrY, qrW, qrH, 'F');
      pdf.addImage(qrDataUrl, 'PNG', qrX, qrY, qrW, qrH);

      // 3. رسم رقم الشهادة أسفل الـ QR (left: 4.3%, top: 87%, width: 8%, height: 3.5%)
      const idX = pdfWidth * 0.043;
      const idY = pdfHeight * 0.87;
      const idW = pdfWidth * 0.08;
      const idH = pdfHeight * 0.035;

      pdf.setFillColor(23, 59, 99); // لون الخلفية الزرقاء الداكنة #173b63
      pdf.rect(idX, idY, idW, idH, 'F');

      pdf.setTextColor(255, 255, 255);
      pdf.setFont("helvetica", "bold");
      pdf.setFontSize(10);
      pdf.text(certificateId, idX + (idW / 2), idY + (idH / 2) + 1.2, { align: "center" });

      // 4. كتابة اسم المشارك في المنتصف بدقة متناهية وحِدة تامة
      // مكان الاسم مطبق على نسب التصميم (left: 25.5%, top: 38.5%, width: 52%, height: 10%)
      const nameBoxX = pdfWidth * 0.255;
      const nameBoxY = pdfHeight * 0.385;
      const nameBoxW = pdfWidth * 0.52;
      const nameBoxH = pdfHeight * 0.10;

      pdf.setTextColor(16, 44, 82); // #102c52
      pdf.setFont("times", "italic");
      pdf.setFontSize(26); // حجم خط واضح وحاد جداً
      
      const textX = nameBoxX + (nameBoxW / 2);
      const textY = nameBoxY + (nameBoxH / 2) + 3;
      pdf.text(participantName, textX, textY, { align: "center" });

      // حفظ الملف النهائي بجودة نقية ومثالية
      pdf.save(`Certificate-${certificateId}.pdf`);

    } catch (err) {
      console.error("PDF error:", err);
      alert("خطأ في إنشاء ملف PDF: " + err.message);
    } finally {
      downloadBtn.disabled = false;
      downloadBtn.textContent = "📄 تنزيل الشهادة PDF بجودة فائقة";
    }
  });
</script>

</body>
</html>
