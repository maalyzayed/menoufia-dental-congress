<style>
*{box-sizing:border-box}
:root{--navy:#12345a;--navy2:#0b2542;--gold:#c9a227;--gold2:#e8cf72}
body{margin:0;min-height:100vh;font-family:Arial,Tahoma,sans-serif;background:radial-gradient(circle at 10% 10%,rgba(201,162,39,.08),transparent 25%),radial-gradient(circle at 90% 90%,rgba(18,52,90,.08),transparent 30%),#f3f6fa;color:#1e293b;padding:30px 15px}
.container{width:100%;max-width:1050px;margin:auto}
.header{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy2),var(--navy));color:white;padding:28px 25px;border-radius:20px;text-align:center;margin-bottom:22px;box-shadow:0 12px 35px rgba(18,52,90,.18)}
.header h1{margin:0 0 8px;font-size:27px;position:relative;z-index:1}
.header p{margin:0;opacity:.88;position:relative;z-index:1}
.gold-line{width:90px;height:3px;background:var(--gold);border-radius:3px;margin:14px auto 0}
.card{background:rgba(255,255,255,.96);padding:25px;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.07);margin-bottom:18px;border:1px solid rgba(18,52,90,.07)}
.card h2{color:var(--navy);margin-top:0;margin-bottom:16px}
.search-box{width:100%;padding:13px 16px;font-size:15px;border:1px solid #cbd5e1;border-radius:11px;margin-bottom:18px;outline:none;background:#fff}
.search-box:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.12)}
.participant{border:1px solid #e2e8f0;border-radius:14px;padding:17px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;background:linear-gradient(180deg,#fff,#fbfcfe)}
.participant-info{flex:1;min-width:250px}.name{font-size:18px;font-weight:bold;color:var(--navy)}
.email{color:#777;margin-top:5px;font-size:14px}.actions-group{display:flex;gap:8px;flex-wrap:wrap}
button,.view-btn{border:none;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block;font-size:13px;transition:.15s}
button:hover{transform:translateY(-1px)}button:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-main{background:linear-gradient(135deg,#d6b43a,#b58b13);color:white;font-size:15px;padding:14px 24px;width:100%;text-align:center;margin-bottom:12px;box-shadow:0 6px 18px rgba(201,162,39,.22)}
.top-actions{display:flex;gap:10px;flex-wrap:wrap}.btn-top{background:var(--navy);color:white;flex:1;padding:12px;text-align:center;font-size:14px}
.btn-email-all{background:#0d9488;color:white;flex:1;padding:12px;text-align:center;font-size:14px}
.view-btn{background:var(--navy);color:white}.btn-create{background:#027a48;color:white}.btn-email-single{background:#0d9488;color:white}
.status{margin-top:15px;padding:12px;border-radius:9px;display:none}.success{background:#ecfdf3;color:#027a48}.error{background:#fff0f0;color:#b42318}
.loading{text-align:center;padding:25px;color:#777}.design-note{background:#f8fafc;border-right:4px solid var(--gold);padding:13px 15px;border-radius:8px;line-height:1.7;color:#475569;margin-top:14px;font-size:13px}
#qrWorkspace{position:fixed;left:-10000px;top:-10000px;width:240px;height:240px;background:#fff}
@media(max-width:700px){body{padding:15px 10px}.header h1{font-size:22px}.card{padding:18px}.top-actions{flex-direction:column}}
</style>
</head>

function formatDoctorName(rawName){
const cleanName=(rawName||"Participant").trim();
if(/^dr[\/\.\s]/i.test(cleanName)) return cleanName.replace(/^dr[\/\.\s]+/i,"DR/ ");
return "DR/ "+cleanName;
}
function getCertificateUrl(certId){
return "https://maalyzayed.github.io/menoufia-dental-congress/certificate.html?id="+encodeURIComponent(certId);
}
function loadImage(dataUrl){
return new Promise((resolve,reject)=>{
const img=new Image();
img.onload=()=>resolve(img);
img.onerror=()=>reject(new Error("تعذر تحميل إحدى صور تصميم الشهادة."));
img.src=dataUrl;
});
}

onAuthStateChanged(auth,(user)=>{
if(user){
if(user.uid===ORGANIZER_UID){
loading.innerHTML="تم التحقق. جاري جلب الحاضرين...";
loadCheckedInParticipants();
}else loading.innerHTML="خطأ: حساب المنظم غير مطابق (UID: "+user.uid+")";
}else loading.innerHTML="يرجى تسجيل الدخول بحساب المنظم في Firebase أولاً.";
});

async function loadCheckedInParticipants(){
try{
const participantsSnap=await getDocs(collection(db,"participants"));
const certificatesSnap=await getDocs(collection(db,"certificates"));
const existingCerts=new Map();

certificatesSnap.forEach(docSnap=>{
const data=docSnap.data();
if(data.participantId) existingCerts.set(data.participantId,docSnap.id);
});

allParticipantsData=[];
participantsSnap.forEach(participantDoc=>{
const data=participantDoc.data();
if(data.attendance===true){
allParticipantsData.push({participantId:participantDoc.id,data:data,certId:existingCerts.get(participantDoc.id)});
}
});
loading.style.display="none";
renderFilteredList("");
}catch(error){
console.error(error);
loading.textContent="حدث خطأ أثناء الجلب: "+error.message;
}
}

function renderFilteredList(query){
list.innerHTML="";
const lowerQuery=query.toLowerCase().trim();
const filtered=allParticipantsData.filter(item=>{
const name=(item.data.fullName||"").toLowerCase();
const email=(item.data.email||"").toLowerCase();
return name.includes(lowerQuery)||email.includes(lowerQuery);
});
if(filtered.length===0){
list.innerHTML="<p style='text-align:center;color:#777'>لا توجد نتائج مطابقة للبحث.</p>";
return;
}
filtered.forEach(item=>renderRow(item.participantId,item.data,item.certId));
}
searchInput.addEventListener("input",e=>renderFilteredList(e.target.value));

function renderRow(participantId,data,certId){
const row=document.createElement("div");
row.className="participant";
const info=document.createElement("div");
info.className="participant-info";
const name=document.createElement("div");
name.className="name";
name.textContent=formatDoctorName(data.fullName);
const email=document.createElement("div");
email.className="email";

const emailBtn=document.createElement("button");

if(!data.email){alert("هذا المستخدم ليس لديه بريد إلكتروني مسجل.");return;}

const subject=encodeURIComponent("شهادة حضور مؤتمر المنوفية لطب الأسنان");

يسعدنا إرسال شهادة حضورك الخاصة بالمؤتمر العلمي الثاني لكلية طب الأسنان جامعة المنوفية.

يمكنك معاينة وتنزيل شهادتك عبر الرابط التالي:

مع تحيات اللجنة المنظمة.`);

}else{

/* إنشاء QR عالي الدقة */
async function createQRDataURL(certId){
qrWorkspace.innerHTML="";
new QRCode(qrWorkspace,{
text:getCertificateUrl(certId),
width:220,
height:220,
correctLevel:QRCode.CorrectLevel.H
});
await new Promise(resolve=>setTimeout(resolve,120));
const canvas=qrWorkspace.querySelector("canvas");
if(canvas) return canvas.toDataURL("image/png");
const img=qrWorkspace.querySelector("img");
if(img){
if(!img.complete) await new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;});
return img.src;
}
throw new Error("تعذر إنشاء QR Code.");
}

/* =========================================================
   بناء الشهادة
   كل النصوص والإطارات والخطوط Vector داخل PDF
========================================================= */
async function buildCertificatePDF(certId,fullName){
const {jsPDF}=window.jspdf;
const pdf=new jsPDF({
orientation:"landscape",
unit:"mm",
format:"a4",
compress:true
});

const W=297,H=210;
const NAVY=[18,52,90],GOLD=[201,162,39],GOLD2=[232,207,114];
const TEXT=[45,55,72],MUTED=[100,110,125];

/* الورق */
pdf.setFillColor(250,249,245);
pdf.rect(0,0,W,H,"F");

/* صورة مبنى الكلية - Watermark */
const building=await loadImage(BUILDING_WATERMARK);
pdf.addImage(building,"JPEG",-5,38,105,150,undefined,"FAST");

/* دوائر زخرفية خفيفة */
pdf.setDrawColor(220,223,224);
pdf.setLineWidth(.35);
pdf.circle(252,105,42);
pdf.circle(252,105,47);

/* الإطار الخارجي Vector */
pdf.setDrawColor(...NAVY);
pdf.setLineWidth(1.25);
pdf.rect(8,8,W-16,H-16);

pdf.setDrawColor(...GOLD);
pdf.setLineWidth(.65);
pdf.rect(11.5,11.5,W-23,H-23);

pdf.setDrawColor(...GOLD2);
pdf.setLineWidth(.25);
pdf.rect(14,14,W-28,H-28);

/* زوايا ذهبية */
pdf.setDrawColor(...GOLD);
pdf.setLineWidth(.8);
[[18,18,35,18,18,35],[W-18,18,W-35,18,W-18,35],[18,H-18,35,H-18,18,H-35],[W-18,H-18,W-35,H-18,W-18,H-35]]
.forEach(c=>{pdf.line(c[0],c[1],c[2],c[3]);pdf.line(c[0],c[1],c[4],c[5]);});

/* اللوجوهات */
const uniLogo=await loadImage(UNIVERSITY_LOGO);
const facultyLogo=await loadImage(FACULTY_LOGO);
pdf.addImage(uniLogo,"PNG",20,18,29,29,undefined,"FAST");
pdf.addImage(facultyLogo,"PNG",W-49,18,30,30,undefined,"FAST");

/* الرأس */
pdf.setFont("Times","bold");
pdf.setTextColor(...NAVY);
pdf.setFontSize(20);
pdf.text("Menoufia University",W/2,25,{align:"center"});
pdf.setFontSize(15);
pdf.text("Faculty of Dentistry",W/2,32,{align:"center"});
pdf.setDrawColor(...GOLD);pdf.setLineWidth(.65);
pdf.line(W/2-55,36,W/2+55,36);
pdf.setFontSize(13);
pdf.text("The Second Scientific Conference",W/2,43,{align:"center"});
pdf.setFontSize(11.5);
pdf.text("of the Faculty of Dentistry, Menoufia University",W/2,49,{align:"center"});

/* شريط عنوان */
const ribbonX=69,ribbonY=53,ribbonW=159,ribbonH=17;
pdf.setFillColor(...NAVY);pdf.setDrawColor(...GOLD);pdf.setLineWidth(.9);
pdf.roundedRect(ribbonX,ribbonY,ribbonW,ribbonH,3,3,"FD");
pdf.setFillColor(...NAVY);
pdf.triangle(ribbonX,ribbonY+ribbonH/2,ribbonX-9,ribbonY+3,ribbonX-9,ribbonY+ribbonH-3,"F");
pdf.triangle(ribbonX+ribbonW,ribbonY+ribbonH/2,ribbonX+ribbonW+9,ribbonY+3,ribbonX+ribbonW+9,ribbonY+ribbonH-3,"F");
pdf.setFont("Times","bold");pdf.setFontSize(19);pdf.setTextColor(...GOLD2);
pdf.text("CERTIFICATE OF ATTENDANCE",W/2,65,{align:"center"});

/* المقدمة */
pdf.setFont("Times","normal");pdf.setFontSize(11.5);pdf.setTextColor(...TEXT);
pdf.text("This is to certify that",W/2,78,{align:"center"});

/* الاسم */
pdf.setFont("Times","italic");pdf.setFontSize(25);pdf.setTextColor(...NAVY);
let displayName=fullName||"DR/ Participant";
if(pdf.getTextWidth(displayName)>210) pdf.setFontSize(20);
else if(pdf.getTextWidth(displayName)>180) pdf.setFontSize(22);
pdf.text(displayName,W/2,94,{align:"center"});
pdf.setDrawColor(...GOLD);pdf.setLineWidth(.7);pdf.line(72,99,225,99);

/* النص */
pdf.setFont("Times","normal");pdf.setFontSize(11.5);pdf.setTextColor(...TEXT);
pdf.text("has attended the",W/2,109,{align:"center"});
pdf.setFont("Times","bold");pdf.setFontSize(13.5);pdf.setTextColor(...NAVY);
pdf.text("Second Scientific Conference of the Faculty of Dentistry,",W/2,118,{align:"center"});
pdf.text("Menoufia University",W/2,126,{align:"center"});

/* التاريخ */
const dateX=105,dateY=132,dateW=87,dateH=13;
pdf.setFillColor(...NAVY);pdf.setDrawColor(...GOLD);pdf.setLineWidth(.7);
pdf.roundedRect(dateX,dateY,dateW,dateH,3,3,"FD");
pdf.setFont("Times","bold");pdf.setFontSize(12.5);pdf.setTextColor(...GOLD2);
pdf.text("26 – 27 August 2026",W/2,141,{align:"center"});

/* زخرفة */
pdf.setDrawColor(...GOLD);pdf.setLineWidth(.5);
pdf.line(75,151,222,151);pdf.circle(148.5,151,1.8);
pdf.setFillColor(...GOLD);pdf.circle(148.5,151,.8,"F");

/* التوقيعات - نفس البيانات الموجودة */
const sigY=167;
pdf.setDrawColor(...GOLD);pdf.setLineWidth(.45);
pdf.line(35,sigY+10,103,sigY+10);
pdf.line(114.5,sigY+10,182.5,sigY+10);
pdf.line(194,sigY+10,262,sigY+10);

pdf.setFont("Times","bold");pdf.setFontSize(8.8);pdf.setTextColor(...NAVY);
pdf.text("Prof. Salah Abdelfatah Hegazy",69,sigY+15,{align:"center"});
pdf.text("As.Prof. Mohamed Abd El Rahman",148.5,sigY+15,{align:"center"});
pdf.text("As.Prof. Mostafa Swedan",228,sigY+15,{align:"center"});

pdf.setFont("Times","normal");pdf.setFontSize(8.2);pdf.setTextColor(...MUTED);
pdf.text("Conference President",69,sigY+21,{align:"center"});
pdf.text("Conference Coordinator",148.5,sigY+21,{align:"center"});
pdf.text("Conference Coordinator",228,sigY+21,{align:"center"});

/* Certificate ID */
pdf.setFont("Times","bold");pdf.setFontSize(8);pdf.setTextColor(...NAVY);
pdf.text(`Certificate ID: ${certId}`,19,196);

/* QR */
const qrDataUrl=await createQRDataURL(certId);
const qrSize=24,qrX=W-46,qrY=165;
pdf.setFillColor(255,255,255);pdf.setDrawColor(...GOLD);pdf.setLineWidth(.55);
pdf.roundedRect(qrX-2,qrY-2,qrSize+4,qrSize+9,2,2,"FD");
pdf.addImage(qrDataUrl,"PNG",qrX,qrY,qrSize,qrSize,undefined,"NONE");
pdf.setFont("Times","normal");pdf.setFontSize(6.5);pdf.setTextColor(...NAVY);
pdf.text("Scan to Verify",qrX+qrSize/2,qrY+qrSize+5,{align:"center"});

/* خط سفلي */
pdf.setDrawColor(...GOLD);pdf.setLineWidth(.7);pdf.line(20,202,W-20,202);

return pdf;
}

async function generateAndDownloadPDF(certId,fullName){
const pdf=await buildCertificatePDF(certId,fullName);
pdf.save(`Certificate-${certId}.pdf`);
}

/* ZIP */
document.getElementById("downloadAllZipBtn").addEventListener("click",async()=>{
const btn=document.getElementById("downloadAllZipBtn");
const certificatesSnap=await getDocs(collection(db,"certificates"));
if(certificatesSnap.empty){alert("لا توجد شهادات مسجلة بعد!");return;}
btn.disabled=true;
try{
const zip=new JSZip();let index=0;
for(const docSnap of certificatesSnap.docs){
index++;
btn.textContent=`جاري معالجة الشهادة ${index} من ${certificatesSnap.size}...`;

zip.file(`Certificate-${certId}.pdf`,pdf.output("arraybuffer"));
}
btn.textContent="📦 جاري ضغط الملفات وتنزيل الـ ZIP...";
const content=await zip.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:6}});
saveAs(content,"Menoufia-Dental-Congress-Certificates-PDF.zip");
alert("تم تنزيل ملف الـ ZIP بنجاح!");
}catch(error){
console.error(error);alert("حدث خطأ أثناء إنشاء ملف الـ ZIP: "+error.message);
}
btn.disabled=false;btn.textContent="📦 تنزيل كل الشهادات كملف ZIP";
});

/* إنشاء الشهادات المفقودة */
document.getElementById("generateAllBtn").addEventListener("click",async()=>{
const btn=document.getElementById("generateAllBtn");
btn.disabled=true;btn.textContent="جاري الفحص وإنشاء الشهادات...";
try{
const participantsSnap=await getDocs(collection(db,"participants"));
const certificatesSnap=await getDocs(collection(db,"certificates"));
const existingCerts=new Map();
certificatesSnap.forEach(docSnap=>{
const d=docSnap.data();
if(d.participantId) existingCerts.set(d.participantId,docSnap.id);
});
let totalCertsCount=certificatesSnap.size,createdCount=0;
for(const participantDoc of participantsSnap.docs){
const data=participantDoc.data(),participantId=participantDoc.id;
if(data.attendance===true&&!existingCerts.has(participantId)){
totalCertsCount++;
const certificateId="MDC-2026-"+String(totalCertsCount).padStart(4,"0");
const finalName=formatDoctorName(data.fullName);
await setDoc(doc(db,"certificates",certificateId),{
fullName:finalName,participantId:participantId,email:data.email||"",
institution:data.institution||"",certificateId:certificateId,createdAt:new Date().toISOString()
});
existingCerts.set(participantId,certificateId);createdCount++;
}
}
statusBox.className="status success";
statusBox.textContent=`تم بنجاح إنشاء ${createdCount} شهادة جديدة.`;
statusBox.style.display="block";
setTimeout(()=>{loadCheckedInParticipants();btn.disabled=false;btn.textContent="🚀 فحص الحاضرين وإنشاء الشهادات المفقودة دفعة واحدة";},1500);
}catch(error){
console.error(error);statusBox.className="status error";statusBox.textContent="حدث خطأ: "+error.message;statusBox.style.display="block";
btn.disabled=false;btn.textContent="🚀 فحص الحاضرين وإنشاء الشهادات المفقودة دفعة واحدة";
}
});
</script>
