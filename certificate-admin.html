<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إصدار الشهادات التلقائي | مؤتمر المنوفية لطب الأسنان</title>

  <!-- مكتبة html2canvas لتحويل الشهادات إلى صور -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- مكتبة JSZip لضغط الصور في ملف ZIP واحد -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- مكتبة FileSaver لحفظ ملف الـ ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
      padding: 30px 15px;
    }
    .container { width: 100%; max-width: 1000px; margin: auto; }
    .header {
      background: #173b63;
      color: white;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      margin-bottom: 25px;
    }
    .header h1 { margin: 0 0 8px; }
    .header p { margin: 0; opacity: 0.85; }
    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .card h2 { color: #173b63; margin-top: 0; }
    
    /* تنسيق صندوق البحث */
    .search-box {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      margin-bottom: 18px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box:focus { border-color: #173b63; }

    .participant {
      border: 1px solid #e0e5eb;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }
    .participant-info { flex: 1; min-width: 250px; }
    .name { font-size: 18px; font-weight: bold; color: #173b63; }
    .email { color: #777; margin-top: 5px; font-size: 14px; }
    .actions-group { display: flex; gap: 8px; flex-wrap: wrap; }
    button, .view-btn {
      border: none;
      border-radius: 9px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      font-size: 13px;
    }
    .btn-main {
      background: #c9a227;
      color: white;
      font-size: 15px;
      padding: 14px 24px;
      width: 100%;
      text-align: center;
      margin-bottom: 12px;
    }
    .top-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-top { background: #475569; color: white; flex: 1; padding: 12px; text-align: center; font-size: 14px; }
    .btn-email-all { background: #0d9488; color: white; flex: 1; padding: 12px; text-align: center; font-size: 14px; }
    .view-btn { background: #173b63; color: white; }
    .btn-create { background: #027a48; color: white; }
    .btn-email-single { background: #0d9488; color: white; }
    .status { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; }
    .success { background: #ecfdf3; color: #027a48; }
    .error { background: #fff0f0; color: #b42318; }
    .loading { text-align: center; padding: 25px; color: #777; }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🎓 إصدار الشهادات التلقائي</h1>
    <p>Menoufia Dental Congress</p>
  </div>

  <div class="card" style="text-align: center;">
    <button id="generateAllBtn" class="btn-main">
      🚀 فحص الحاضرين وإنشاء الشهادات المفقودة دفعة واحدة
    </button>
    <div class="top-actions">
      <button id="downloadAllZipBtn" class="btn-top">📦 تنزيل كل الشهادات كملف مضغوط (ZIP)</button>
      <button id="sendAllEmailBtn" class="btn-email-all">📧 إرسال عبر الإيميل للجميع</button>
    </div>
  </div>

  <div class="card">
    <h2>قائمة المشاركين الحاضرين</h2>
    <!-- خانة البحث -->
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث بالاسم أو البريد الإلكتروني...">
    
    <div id="loading" class="loading">جاري تحميل بيانات الحاضرين...</div>
    <div id="participantsList"></div>
    <div id="status" class="status"></div>
  </div>

</div>

<!-- صندوق خفي لتوليد الشهادات برمجياً وضغطها -->
<div id="hiddenCertificateContainer" style="position: absolute; left: -9999px; top: -9999px;">
  <div id="renderCert" style="position: relative; width: 1536px; height: 1024px; background-image: url('certificate-template.jpg?v=2'); background-size: 100% 100%; background-position: center; background-repeat: no-repeat; padding: 55px;">
    <div style="position: absolute; left: 20%; top: 39.5%; width: 60%; height: 12%; display: flex; align-items: center; justify-content: center;">
      <div id="renderName" style="color: #102c52; font-family: 'Brush Script MT', 'Segoe Script', cursive; font-size: 50px; white-space: nowrap;"></div>
    </div>
    <div style="position: absolute; left: 5.5%; top: 66%; width: 9.5%; height: 15%; background: white; display: flex; align-items: center; justify-content: center;" id="renderQr"></div>
    <div style="position: absolute; left: 5.5%; top: 81.5%; width: 9.5%; height: 4%; background: #173b63; display: flex; align-items: center; justify-content: center;">
      <div id="renderId" style="color: white; font-family: Arial, sans-serif; font-size: 11px; font-weight: bold;"></div>
    </div>
  </div>
</div>

<!-- مكتبة QR Code -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
  import { initializeAuth, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
  
  const firebaseConfig = {
    apiKey: "AIzaSyAB-AIOIQH0tOcVXQnUt7pvVnQi0CoFwSo",
    authDomain: "menoufia-dental-congress.firebaseapp.com",
    projectId: "menoufia-dental-congress",
    storageBucket: "menoufia-dental-congress.firebasestorage.app",
    messagingSenderId: "20481129823",
    appId: "1:20481129823:web:24658314d19bcacf1dcaea"
  };

  const app = initializeApp(firebaseConfig);
  const auth = initializeAuth(app, { persistence: browserLocalPersistence });
  const db = getFirestore(app);
  const ORGANIZER_UID = "fS56FR5b2vdd632fpUZWXbJFWwj1";

  const loading = document.getElementById("loading");
  const list = document.getElementById("participantsList");
  const statusBox = document.getElementById("status");
  const searchInput = document.getElementById("searchInput");

  let allParticipantsData = []; // لتخزين البيانات والبحث فيها بسلاسة

  onAuthStateChanged(auth, (user) => {
    if (user) {
      if (user.uid === ORGANIZER_UID) {
        loading.innerHTML = "تم التحقق. جاري جلب الحاضرين...";
        loadCheckedInParticipants();
      } else {
        loading.innerHTML = "خطأ: حساب المنظم غير مطابق (UID: " + user.uid + ")";
      }
    } else {
      loading.innerHTML = "يرجى تسجيل الدخول بحساب المنظم في Firebase أولاً.";
    }
  });

  function formatDoctorName(rawName) {
    const cleanName = (rawName || "Participant").trim();
    if (/^dr[\/.\s]/i.test(cleanName)) {
      return cleanName.replace(/^dr[\/.\s]+/i, "DR/ ");
    }
    return "DR/ " + cleanName;
  }

  async function loadCheckedInParticipants() {
    try {
      const participantsSnap = await getDocs(collection(db, "participants"));
      const certificatesSnap = await getDocs(collection(db, "certificates"));
      
      const existingCerts = new Map();
      certificatesSnap.forEach(docSnap => {
        const data = docSnap.data();
        if (data.participantId) {
          existingCerts.set(data.participantId, docSnap.id);
        }
      });

      allParticipantsData = [];
      participantsSnap.forEach(participantDoc => {
        const data = participantDoc.data();
        if (data.attendance === true) {
          allParticipantsData.push({
            participantId: participantDoc.id,
            data: data,
            certId: existingCerts.get(participantDoc.id)
          });
        }
      });

      loading.style.display = "none";
      renderFilteredList("");

    } catch (error) {
      console.error(error);
      loading.textContent = "حدث خطأ أثناء الجلب: " + error.message;
    }
  }

  function renderFilteredList(query) {
    list.innerHTML = "";
    const lowerQuery = query.toLowerCase().trim();

    const filtered = allParticipantsData.filter(item => {
      const name = (item.data.fullName || "").toLowerCase();
      const email = (item.data.email || "").toLowerCase();
      return name.includes(lowerQuery) || email.includes(lowerQuery);
    });

    if (filtered.length === 0) {
      list.innerHTML = "<p style='text-align: center; color: #777;'>لا توجد نتائج مطابقة للبحث.</p>";
      return;
    }

    filtered.forEach(item => {
      renderRow(item.participantId, item.data, item.certId);
    });
  }

  // تفعيل البحث عند الكتابة
  searchInput.addEventListener("input", (e) => {
    renderFilteredList(e.target.value);
  });

  function renderRow(participantId, data, certId) {
    const row = document.createElement("div");
    row.className = "participant";

    const info = document.createElement("div");
    info.className = "participant-info";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = formatDoctorName(data.fullName);

    const email = document.createElement("div");
    email.className = "email";
    email.textContent = data.email || "بدون بريد إلكتروني";

    info.appendChild(name);
    info.appendChild(email);

    const actions = document.createElement("div");
    actions.className = "actions-group";

    if (certId) {
      const viewLink = document.createElement("a");
      viewLink.className = "view-btn";
      viewLink.textContent = "عرض الشهادة";
      viewLink.href = "certificate.html?id=" + encodeURIComponent(certId);
      viewLink.target = "_blank";
      actions.appendChild(viewLink);

      const downloadSingleBtn = document.createElement("button");
      downloadSingleBtn.className = "view-btn";
      downloadSingleBtn.style.background = "#c9a227";
      downloadSingleBtn.textContent = "📥 تنزيل";
      downloadSingleBtn.onclick = async () => {
        downloadSingleBtn.disabled = true;
        downloadSingleBtn.textContent = "جاري الحفظ...";
        await generateAndDownloadSingle(certId, formatDoctorName(data.fullName));
        downloadSingleBtn.disabled = false;
        downloadSingleBtn.textContent = "📥 تنزيل";
      };
      actions.appendChild(downloadSingleBtn);

      const emailBtn = document.createElement("button");
      emailBtn.className = "view-btn btn-email-single";
      emailBtn.textContent = "📧 إرسال إيميل";
      emailBtn.onclick = () => {
        if (!data.email) {
          alert("هذا المستخدم ليس لديه بريد إلكتروني مسجل.");
          return;
        }
        const certUrl = window.location.origin + "/certificate.html?id=" + encodeURIComponent(certId);
        const subject = encodeURIComponent("شهادة حضور مؤتمر المنوفية لطب الأسنان");
        const body = encodeURIComponent(`مرحباً ${formatDoctorName(data.fullName)},\n\nيسعدنا إرسال شهادة حضورك الخاصة بمؤتمر المنوفية لطب الأسنان.\nيمكنك معاينة وتنزيل شهادتك عبر الرابط التالي:\n${certUrl}\n\nمع تحيات اللجنة المنظمة.`);
        window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${data.email}&su=${subject}&body=${body}`, '_blank');
      };
      actions.appendChild(emailBtn);
    } else {
      const createBtn = document.createElement("button");
      createBtn.className = "view-btn btn-create";
      createBtn.textContent = "إنشاء الشهادة";
      createBtn.onclick = async () => {
        createBtn.disabled = true;
        createBtn.textContent = "جاري الإنشاء...";
        try {
          const certificatesSnap = await getDocs(collection(db, "certificates"));
          const nextNum = certificatesSnap.size + 1;
          const certificateId = "MDC-2026-" + String(nextNum).padStart(4, "0");
          const finalName = formatDoctorName(data.fullName);

          await setDoc(doc(db, "certificates", certificateId), {
            fullName: finalName,
            participantId: participantId,
            email: data.email || "",
            institution: data.institution || "",
            certificateId: certificateId,
            createdAt: new Date().toISOString()
          });
          loadCheckedInParticipants();
        } catch (err) {
          alert("خطأ: " + err.message);
          createBtn.disabled = false;
          createBtn.textContent = "إنشاء الشهادة";
        }
      };
      actions.appendChild(createBtn);
    }

    row.appendChild(info);
    row.appendChild(actions);
    list.appendChild(row);
  }

  async function generateAndDownloadSingle(certId, fullName) {
    const canvas = await renderCertificateCanvas(certId, fullName);
    canvas.toBlob(blob => {
      saveAs(blob, `Certificate-${certId}.png`);
    });
  }

  async function renderCertificateCanvas(certId, fullName) {
    const renderDiv = document.getElementById("renderCert");
    document.getElementById("renderName").textContent = fullName;
    document.getElementById("renderId").textContent = certId;
    
    const qrDiv = document.getElementById("renderQr");
    qrDiv.innerHTML = "";
    const verificationUrl = window.location.origin + "/certificate.html?id=" + encodeURIComponent(certId);
    new QRCode(qrDiv, { text: verificationUrl, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.H });

    await new Promise(r => setTimeout(r, 200));
    return await html2canvas(renderDiv, { scale: 2, useCORS: true });
  }

  document.getElementById("downloadAllZipBtn").addEventListener("click", async () => {
    const btn = document.getElementById("downloadAllZipBtn");
    const certificatesSnap = await getDocs(collection(db, "certificates"));
    
    if (certificatesSnap.empty) {
      alert("لا توجد شهادات مسجلة بعد!");
      return;
    }

    btn.disabled = true;
    btn.textContent = "⏳ جاري إعداد وضغط الشهادات، قد يستغرق ذلك بضع ثوانٍ...";

    try {
      const zip = new JSZip();
      let index = 0;

      for (const docSnap of certificatesSnap.docs) {
        index++;
        btn.textContent = `جاري معالجة الشهادة ${index} من ${certificatesSnap.size}...`;
        
        const certId = docSnap.id;
        const fullName = docSnap.data().fullName || "Participant";
        
        const canvas = await renderCertificateCanvas(certId, fullName);
        const imgData = canvas.toDataURL("image/png").replace(/^data:image\/png;base64,/, "");
        zip.file(`Certificate-${certId}.png`, imgData, { base64: true });
      }

      btn.textContent = "📦 جاري ضغط الملفات وتنزيل الـ ZIP...";
      const content = await zip.generateAsync({ type: "blob" });
      saveAs(content, "Menoufia-Dental-Congress-Certificates.zip");

      btn.disabled = false;
      btn.textContent = "📦 تنزيل كل الشهادات كملف مضغوط (ZIP)";
      alert("تم تنزيل ملف الـ ZIP بنجاح!");

    } catch (error) {
      console.error(error);
      alert("حدث خطأ أثناء إنشاء ملف الـ ZIP: " + error.message);
      btn.disabled = false;
      btn.textContent = "📦 تنزيل كل الشهادات كملف مضغوط (ZIP)";
    }
  });

  document.getElementById("sendAllEmailBtn").addEventListener("click", async () => {
    if (!confirm("هل تريد فتح رسائل البريد الإلكتروني للمشاركين الحاضرين؟")) return;
    const certificatesSnap = await getDocs(collection(db, "certificates"));
    let count = 0;
    certificatesSnap.forEach(docSnap => {
      const data = docSnap.data();
      if (data.email) {
        count++;
        const certUrl = window.location.origin + "/certificate.html?id=" + encodeURIComponent(docSnap.id);
        const subject = encodeURIComponent("شهادة حضور مؤتمر المنوفية لطب الأسنان");
        const body = encodeURIComponent(`مرحباً ${data.fullName},\n\nإليك رابط شهادة حضورك في مؤتمر المنوفية لطب الأسنان:\n${certUrl}\n\nمع تحيات اللجنة المنظمة.`);
        setTimeout(() => {
          window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${data.email}&su=${subject}&body=${body}`, '_blank');
        }, count * 600);
      }
    });
    alert(`تم فتح تبويبات الإرسال لـ ${count} مشارك.`);
  });

  document.getElementById("generateAllBtn").addEventListener("click", async () => {
    const btn = document.getElementById("generateAllBtn");
    btn.disabled = true;
    btn.textContent = "جاري الفحص وإنشاء الشهادات...";

    try {
      const participantsSnap = await getDocs(collection(db, "participants"));
      const certificatesSnap = await getDocs(collection(db, "certificates"));

      const existingCerts = new Map();
      certificatesSnap.forEach(docSnap => {
        const d = docSnap.data();
        if (d.participantId) existingCerts.set(d.participantId, docSnap.id);
      });

      let totalCertsCount = certificatesSnap.size;
      let createdCount = 0;

      for (const participantDoc of participantsSnap.docs) {
        const data = participantDoc.data();
        const participantId = participantDoc.id;

        if (data.attendance === true && !existingCerts.has(participantId)) {
          totalCertsCount++;
          const certificateId = "MDC-2026-" + String(totalCertsCount).padStart(4, "0");
          const finalName = formatDoctorName(data.fullName);

          await setDoc(doc(db, "certificates", certificateId), {
            fullName: finalName,
            participantId: participantId,
            email: data.email || "",
            institution: data.institution || "",
            certificateId: certificateId,
            createdAt: new Date().toISOString()
          });

          existingCerts.set(participantId, certificateId);
          createdCount++;
        }
      }

      statusBox.className = "status success";
      statusBox.textContent = `تم بنجاح إنشاء ${createdCount} شهادة جديدة.`;
      statusBox.style.display = "block";

      setTimeout(() => {
        loadCheckedInParticipants();
        btn.disabled = false;
        btn.textContent = "🚀 فحص الحاضرين وإنشاء الشهادات المفقودة دفعة واحدة";
      }, 1500);

    } catch (error) {
      console.error(error);
      statusBox.className = "status error";
      statusBox.textContent = "حدث خطأ: " + error.message;
      statusBox.style.display = "block";
      btn.disabled = false;
      btn.textContent = "🚀 فحص الحاضرين وإنشاء الشهادات المفقودة دفعة واحدة";
    }
  });
</script>

</body>
</html>
