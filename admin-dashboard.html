<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conference Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .header {
      background: #173b63;
      color: white;
      padding: 22px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 5px 0 0;
      opacity: 0.85;
    }

    .logout,
    .refresh-button,
    .filter-btn {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout {
      background: white;
      color: #173b63;
      padding: 10px 18px;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .refresh-button {
      background: #173b63;
      color: white;
      padding: 11px 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .stat-title {
      color: #777;
      font-size: 14px;
    }

    .stat-number {
      font-size: 32px;
      font-weight: bold;
      color: #173b63;
      margin-top: 8px;
    }

    .search-box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .search-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dbe3;
      border-radius: 9px;
      font-size: 15px;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 18px;
      border: 1px solid #173b63;
      background: white;
      color: #173b63;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: #173b63;
      color: white;
    }

    .table-container {
      background: white;
      border-radius: 15px;
      overflow-x: auto;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th, td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #f7f9fc;
      color: #173b63;
    }

    .checked {
      color: #26734d;
      font-weight: bold;
    }

    .not-checked {
      color: #b42318;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  
    @media print {
      body {
        background: white !important;
        color: black !important;
      }

      header {
        background: white !important;
        color: black !important;
        border-bottom: 2px solid #183f68;
      }

      header h1,
      header p {
        color: black !important;
      }

      .toolbar,
      .search-box,
      .refresh-button,
      #logoutButton,
      button {
        display: none !important;
      }

      .stats {
        display: grid !important;
        grid-template-columns: repeat(4, 1fr) !important;
        gap: 12px !important;
      }

      .stat,
      .table-container {
        box-shadow: none !important;
        border: 1px solid #ddd !important;
      }

      .table-container {
        margin-top: 20px !important;
      }

      table {
        width: 100% !important;
        font-size: 11px !important;
      }

      th,
      td {
        color: black !important;
        border-bottom: 1px solid #ddd !important;
      }

      .checked {
        color: #087f23 !important;
      }

      .not-checked {
        color: #b00020 !important;
      }

      @page {
        size: A4 landscape;
        margin: 12mm;
      }
    }

  </style>
</head>

<body>

  <header class="header">
    <div class="header-inner">
      <div>
        <h1>Menoufia Dental Congress</h1>
        <p>Organizer Dashboard</p>
      </div>

      <button class="logout" id="logoutButton">Logout</button>
    </div>
  </header>

  <div class="container">

    <div class="toolbar" style="gap:10px;">
   

  <button class="refresh-button" id="refreshButton">
    🔄 Refresh Data
  </button>

  <button class="refresh-button" id="exportButton">
    📥 Export CSV
  </button>

  <button class="refresh-button" id="printButton">
    🖨️ Print Attendance
  </button>

  <a
    href="evaluation-dashboard.html"
    class="refresh-button"
    style="text-decoration:none; display:inline-block;">
    📊 Evaluation
  </a>

</div>

    <div class="stats">

      <div class="stat">
        <div class="stat-title">Total Participants</div>
        <div class="stat-number" id="totalParticipants">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">Checked In</div>
        <div class="stat-number" id="checkedIn">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">Not Checked In</div>
        <div class="stat-number" id="notCheckedIn">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">Attendance Rate</div>
        <div class="stat-number" id="attendanceRate">0%</div>
      </div>

    </div>

    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="Search by name, email, institution or participant ID..."
      >

      <div class="filters">

        <button
          type="button"
          class="filter-btn active"
          data-filter="all"
        >
          All
        </button>

        <button
          type="button"
          class="filter-btn"
          data-filter="checked"
        >
          ✓ Checked In
        </button>

        <button
          type="button"
          class="filter-btn"
          data-filter="not-checked"
        >
          ✕ Not Checked In
        </button>

      </div>

    </div>

    <div class="table-container">

      <table>

        <thead>
          <tr>
            <th>Participant ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Institution</th>
            <th>Type</th>
            <th>Status</th>
            <th>Check-in Time</th>
          </tr>
        </thead>

        <tbody id="participantsTable">
          <tr>
            <td colspan="7" class="empty">
              Loading participants...
            </td>
          </tr>
        </tbody>

      </table>

    </div>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs
    }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    const firebaseConfig = {
  apiKey: "AIzaSyAB-AIOIQH0tOcVXQnUt7pvVnQi0CoFwSo",
  authDomain: "menoufia-dental-congress.firebaseapp.com",
  projectId: "menoufia-dental-congress",
  storageBucket: "menoufia-dental-congress.firebasestorage.app",
  messagingSenderId: "20481129823",
  appId: "1:20481129823:web:24658314d19bcacf1dcaea"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let participants = [];
    let currentFilter = "all";

    // Protect the dashboard.
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.replace("admin-login.html");
        return;
      }

      loadParticipants();
    });

    async function loadParticipants() {
      const table = document.getElementById("participantsTable");

      table.innerHTML = `
        <tr>
          <td colspan="7" class="empty">Loading participants...</td>
        </tr>
      `;

      try {
        const snapshot = await getDocs(
          collection(db, "participants")
        );

        participants = [];

        snapshot.forEach((documentSnapshot) => {
          participants.push({
            id: documentSnapshot.id,
            ...documentSnapshot.data()
          });
        });

        updateStats();
        applyFilters();

        console.log("Participants loaded:", participants.length);

      } catch (error) {
        console.error("Firebase Error:", error);

        table.innerHTML = `
          <tr>
            <td colspan="7" class="empty">
              Unable to load participants.<br>
              ${error.code || error.message}
            </td>
          </tr>
        `;
      }
    }

    function updateStats() {
      const total = participants.length;

      const checked = participants.filter(
        (p) => p.attendance === true
      ).length;

      const notChecked = total - checked;

      const rate = total === 0
        ? 0
        : Math.round((checked / total) * 100);

      document.getElementById("totalParticipants").textContent = total;
      document.getElementById("checkedIn").textContent = checked;
      document.getElementById("notCheckedIn").textContent = notChecked;
      document.getElementById("attendanceRate").textContent = rate + "%";
    }

    function filterParticipants(filter) {
      currentFilter = filter;

      document.querySelectorAll(".filter-btn").forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.filter === filter
        );
      });

      applyFilters();
    }

    function applyFilters() {
      const query = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

      const filtered = participants.filter((p) => {

        const searchableText = [
          p.participantId,
          p.fullName,
          p.email,
          p.institution,
          p.category
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        const matchesSearch =
          searchableText.includes(query);

        let matchesFilter = true;

        if (currentFilter === "checked") {
          matchesFilter = p.attendance === true;
        } else if (currentFilter === "not-checked") {
          matchesFilter = p.attendance !== true;
        }

        return matchesSearch && matchesFilter;
      });

      displayParticipants(filtered);
    }

    function displayParticipants(list) {
      const table =
        document.getElementById("participantsTable");

      if (list.length === 0) {
        table.innerHTML = `
          <tr>
            <td colspan="7" class="empty">
              No participants found.
            </td>
          </tr>
        `;
        return;
      }

      table.innerHTML = list.map((p) => {

        const status =
          p.attendance === true
            ? `<span class="checked">✓ Checked In</span>`
            : `<span class="not-checked">Not Checked In</span>`;

        let checkInTime = "-";

        if (p.checkInTime) {
          const date = new Date(p.checkInTime);

          if (!Number.isNaN(date.getTime())) {
            checkInTime = date.toLocaleString();
          }
        }

        return `
          <tr>
            <td>${escapeHtml(p.participantId || p.id || "")}</td>
            <td>${escapeHtml(p.fullName || "")}</td>
            <td>${escapeHtml(p.email || "")}</td>
            <td>${escapeHtml(p.institution || "")}</td>
            <td>${escapeHtml(p.category || "")}</td>
            <td>${status}</td>
            <td>${escapeHtml(checkInTime)}</td>
          </tr>
        `;

      }).join("");
    }

    document
      .getElementById("searchInput")
      .addEventListener("input", applyFilters);

    document
      .querySelectorAll(".filter-btn")
      .forEach((button) => {
        button.addEventListener("click", () => {
          filterParticipants(button.dataset.filter);
        });
      });

    document
      .getElementById("refreshButton")
      .addEventListener("click", loadParticipants);

    document
      .getElementById("logoutButton")
      .addEventListener("click", async () => {
        await signOut(auth);
        window.location.replace("admin-login.html");
      });

    function exportCSV() {
      if (participants.length === 0) {
        alert("No participants to export.");
        return;
      }

      const headers = [
        "Participant ID",
        "Name",
        "Email",
        "Institution",
        "Type",
        "Status",
        "Check-in Time"
      ];

      const rows = participants.map((p) => {
        let checkInTime = "";

        if (p.checkInTime) {
          const date = new Date(p.checkInTime);
          if (!Number.isNaN(date.getTime())) {
            checkInTime = date.toLocaleString();
          }
        }

        return [
          p.participantId || p.id || "",
          p.fullName || "",
          p.email || "",
          p.institution || "",
          p.category || "",
          p.attendance === true ? "Checked In" : "Not Checked In",
          checkInTime
        ];
      });

      const csv = [headers, ...rows]
        .map((row) =>
          row.map((value) => {
            const text = String(value ?? "");
            return '"' + text.replaceAll('"', '""') + '"';
          }).join(",")
        )
        .join("\r\n");

      const blob = new Blob(["\uFEFF" + csv], {
        type: "text/csv;charset=utf-8;"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "menoufia-dental-congress-participants.csv";

      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);
    }

    document
      .getElementById("exportButton")
      .addEventListener("click", exportCSV);

    document
      .getElementById("printButton")
      .addEventListener("click", function () {
        displayParticipants(participants);
        window.print();
      });

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

  </script>

</body>
</html>
