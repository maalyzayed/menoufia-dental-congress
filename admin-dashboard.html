<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conference Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .header {
      background: #173b63;
      color: white;
      padding: 22px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 5px 0 0;
      opacity: 0.85;
    }

    .logout {
      background: white;
      color: #173b63;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .stat-title {
      color: #777;
      font-size: 14px;
    }

    .stat-number {
      font-size: 32px;
      font-weight: bold;
      color: #173b63;
      margin-top: 8px;
    }

    .search-box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .search-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dbe3;
      border-radius: 9px;
      font-size: 15px;
    }

    .table-container {
      background: white;
      border-radius: 15px;
      overflow-x: auto;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #f7f9fc;
      color: #173b63;
    }

    .checked {
      color: #26734d;
      font-weight: bold;
    }

    .not-checked {
      color: #b42318;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (max-width: 700px) {

      .stats {
        grid-template-columns: 1fr;
      }

      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }

    }
    .filter-btn {
  padding: 10px 18px;
  border: 1px solid #173b63;
  background: white;
  color: #173b63;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.filter-btn:hover {
  background: #173b63;
  color: white;
}
  </style>
</head>

<body>

<header class="header">

  <div class="header-inner">

    <div>
      <h1>Menoufia Dental Congress</h1>
      <p>Organizer Dashboard</p>
    </div>

    <button class="logout" id="logoutButton">
      Logout
    </button>

  </div>

</header>


<div class="container">
<div style="margin-bottom:20px; display:flex; justify-content:flex-end;">
  <button
    id="refreshButton"
    style="
      background:#173b63;
      color:white;
      border:none;
      padding:11px 20px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    "
  >
    🔄 Refresh Data
  </button>
</div>
<div class="stats">

  <div class="stat">

    <div class="stat-title">
      Total Participants
    </div>

    <div class="stat-number" id="totalParticipants">
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-title">
      Checked In
    </div>

    <div class="stat-number" id="checkedIn">
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-title">
      Not Checked In
    </div>

    <div class="stat-number" id="notCheckedIn">
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-title">
      Attendance Rate
    </div>

    <div class="stat-number" id="attendanceRate">
      0%
    </div>

  </div>

</div>


<div class="search-box">

  <input
    type="text"
    id="searchInput"
    placeholder="Search by name, email, institution or participant ID..."
  >

  <div style="display:flex; gap:10px; margin:15px 0; flex-wrap:wrap;">

    <button
      onclick="filterParticipants('all')"
      class="filter-btn"
    >
      All
    </button>

    <button
      onclick="filterParticipants('checked')"
      class="filter-btn"
    >
      ✓ Checked In
    </button>

    <button
      onclick="filterParticipants('not-checked')"
      class="filter-btn"
    >
      ✕ Not Checked In
    </button>

  </div>

</div>

</div>
    >

  </div>


  <div class="table-container">

    <table>

      <thead>

        <tr>

          <th>Participant ID</th>

          <th>Name</th>

          <th>Email</th>

          <th>Institution</th>

          <th>Type</th>

          <th>Status</th>

          <th>Check-in Time</th>

        </tr>

      </thead>

      <tbody id="participantsTable">

        <tr>
          <td colspan="7" class="empty">
            Loading participants...
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    getFirestore,
    collection,
    getDocs
  }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


  const firebaseConfig = {

    apiKey: "AIzaSyAB-AIOIQH0tOcVXQnUt7pvVnQi0CoFwSo",

    authDomain:
      "menoufia-dental-congress.firebaseapp.com",

    projectId:
      "menoufia-dental-congress",

    storageBucket:
      "menoufia-dental-congress.firebasestorage.app",

    messagingSenderId:
      "20481129823",

    appId:
      "1:20481129823:web:24658314d19bcacf1dcaea"

  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);

  const auth = getAuth(app);


  let participants = [];


  // Protect dashboard

  onAuthStateChanged(auth, (user) => {

    if (!user) {

      window.location.replace(
        "admin-login.html"
      );

      return;

    }


    loadParticipants();

  });


  // Load participants

async function loadParticipants() {
  try {

    console.log("Loading participants...");

    const snapshot = await getDocs(
      collection(db, "participants")
    );

    console.log("Participants found:", snapshot.size);

    participants = [];

    snapshot.forEach((doc) => {

      participants.push({
        id: doc.id,
        ...doc.data()
      });

    });

    console.log("Participants:", participants);

    updateStats();
    displayParticipants(participants);

  } catch (error) {

    console.error("FIREBASE ERROR:", error);

    document.getElementById("participantsTable").innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          Unable to load participants.<br>
          ${error.code || ""}
        </td>
      </tr>
    `;
  }
}
  document
  .getElementById("refreshButton")
  .addEventListener("click", loadParticipants);

loadParticipants();


  // Statistics

  function updateStats() {

    const total =
      participants.length;


    const checked =
      participants.filter(
        p => p.attendance === true
      ).length;


    const notChecked =
      total - checked;


    document.getElementById(
      "totalParticipants"
    ).textContent = total;


    document.getElementById(
      "checkedIn"
    ).textContent = checked;


    document.getElementById(
      "notCheckedIn"
    ).textContent = notChecked;
const rate =
  total === 0
    ? 0
    : Math.round((checked / total) * 100);

document.getElementById(
  "attendanceRate"
).textContent = rate + "%";
  }


  // Current filter

let currentFilter = "all";


// Display participants

function displayParticipants(list) {

  const table =
    document.getElementById(
      "participantsTable"
    );


  if (list.length === 0) {

    table.innerHTML = `

      <tr>
        <td colspan="7" class="empty">
          No participants found.
        </td>
      </tr>

    `;

    return;
  }


  table.innerHTML =
    list.map(p => {

      const status =
        p.attendance === true
          ? `<span class="checked">✓ Checked In</span>`
          : `<span class="not-checked">Not Checked In</span>`;


      let checkInTime = "-";


      if (p.checkInTime) {

        checkInTime =
          new Date(
            p.checkInTime
          ).toLocaleString();

      }


      return `

        <tr>

          <td>
            ${escapeHtml(p.participantId || "")}
          </td>

          <td>
            ${escapeHtml(p.fullName || "")}
          </td>

          <td>
            ${escapeHtml(p.email || "")}
          </td>

          <td>
            ${escapeHtml(p.institution || "")}
          </td>

          <td>
            ${escapeHtml(p.category || "")}
          </td>

          <td>
            ${status}
          </td>

          <td>
            ${checkInTime}
          </td>

        </tr>

      `;

    }).join("");

}


// Filter participants

function filterParticipants(filter) {

  currentFilter = filter;

  applyFilters();

}


// Search + Filter

function applyFilters() {

  const searchInput =
    document.getElementById(
      "searchInput"
    );


  const query =
    searchInput.value
      .toLowerCase()
      .trim();


  let filtered =
    participants.filter(p => {

      const matchesSearch =

        (p.participantId || "")
          .toLowerCase()
          .includes(query)

        ||

        (p.fullName || "")
          .toLowerCase()
          .includes(query)

        ||

        (p.email || "")
          .toLowerCase()
          .includes(query)

        ||

        (p.institution || "")
          .toLowerCase()
          .includes(query);


      let matchesFilter = true;


      if (currentFilter === "checked") {

        matchesFilter =
          p.attendance === true;

      }


      if (currentFilter === "not-checked") {

        matchesFilter =
          p.attendance !== true;

      }


      return (
        matchesSearch &&
        matchesFilter
      );

    });


  displayParticipants(filtered);

}


// Search box

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    applyFilters
  );


  // HTML protection

  function escapeHtml(value) {

    return String(value)

      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  // Logout

  document
    .getElementById("logoutButton")
    .addEventListener(
      "click",
      async () => {

        await signOut(auth);

        window.location.replace(
          "admin-login.html"
        );

      }
    );
let currentFilter = "all";

function filterParticipants(filter) {
  currentFilter = filter;
  displayParticipants(participants);
}
</script>

</body>
</html>
