<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Organizer Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      width: 90%;
      max-width: 430px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #173b63;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      margin-top: 18px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dbe3;
      border-radius: 9px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #173b63;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #fff0f0;
      color: #b42318;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Organizer Login</h1>

  <p class="subtitle">
    Menoufia Dental Congress
  </p>

  <form id="loginForm">

    <label for="email">
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="Organizer email"
      required
    >

    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <button type="submit" id="loginButton">
      Login
    </button>

    <div class="error" id="errorMessage"></div>

  </form>

</div>


<script type="module">

 import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  initializeAuth,
  browserLocalPersistence,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  const firebaseConfig = {

    apiKey: "AIzaSyAB-AIOIQH0tOcVXQnUt7pvVnQi0CoFwSo",

    authDomain:
      "menoufia-dental-congress.firebaseapp.com",

    projectId:
      "menoufia-dental-congress",

    storageBucket:
      "menoufia-dental-congress.firebasestorage.app",

    messagingSenderId:
      "20481129823",

    appId:
      "1:20481129823:web:24658314d19bcacf1dcaea"

  };


  const app = initializeApp(firebaseConfig);

  const auth = initializeAuth(app, {
  persistence: browserLocalPersistence
});


  const form =
    document.getElementById("loginForm");

  const button =
    document.getElementById("loginButton");

  const errorMessage =
    document.getElementById("errorMessage");


  form.addEventListener("submit", async (event) => {

    event.preventDefault();

    button.disabled = true;
    button.textContent = "Logging in...";

    errorMessage.style.display = "none";


    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


  try {

await setPersistence(
  auth,
  browserLocalPersistence
);

await signInWithEmailAndPassword(
  auth,
  email,
  password
);

  const params = new URLSearchParams(
    window.location.search
  );

  const redirect =
    params.get("redirect");

  if (redirect === "evaluation") {

    window.location.href =
      "evaluation-dashboard.html";

  } else {

    window.location.href =
      "admin-dashboard.html";

  }

} catch (error) {

      console.error(error);

      errorMessage.textContent =
        "Invalid email or password.";

      errorMessage.style.display = "block";

      button.disabled = false;
      button.textContent = "Login";

    }

  });

</script>

</body>
</html>
